name: ci

on:
  push:
    branches:
      - main
  pull_request:

# A new push to a pull request cancels its running checks; each commit on main gets its own run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Each job grants only what it needs.
permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  # `just check` on every supported platform: macos-26 is Apple Silicon (kqueue), Ubuntu runs io_uring.
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      # renovate: datasource=crate depName=taplo-cli
      TAPLO_VERSION: "0.10.0"
      # renovate: datasource=crate depName=typos-cli
      TYPOS_VERSION: "1.51.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          # renovate: datasource=github-releases depName=casey/just
          just-version: "1.59.0"
      # The pinned stable and nightly, before rust-cache: its key includes the rustc version.
      - run: just toolchains
      # `just check` also builds fuzz/, a workspace of its own.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            . -> target
            fuzz -> target
      - uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b # v2.89.0
        with:
          tool: taplo@${{ env.TAPLO_VERSION }},typos@${{ env.TYPOS_VERSION }}
      - run: just check

  # Build matrix and dependency checks: platform-independent, Linux only.
  deps:
    strategy:
      fail-fast: false
      matrix:
        recipe: [hack, msrv, minimal-versions, deny]
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      # renovate: datasource=crate depName=cargo-hack
      CARGO_HACK_VERSION: "0.6.45"
      # renovate: datasource=crate depName=cargo-deny
      CARGO_DENY_VERSION: "0.20.2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          # renovate: datasource=github-releases depName=casey/just
          just-version: "1.59.0"
      # The pinned nightly also serves `-Z direct-minimal-versions`.
      - run: just toolchains
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.recipe }}
      - uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b # v2.89.0
        with:
          tool: cargo-hack@${{ env.CARGO_HACK_VERSION }},cargo-deny@${{ env.CARGO_DENY_VERSION }}
      - env:
          RECIPE: ${{ matrix.recipe }}
        run: just "$RECIPE"

  # Coverage of the tests, shown in the job summary: informational, not part of the gate.
  coverage:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # renovate: datasource=crate depName=cargo-llvm-cov
      CARGO_LLVM_COV_VERSION: "0.9.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          # renovate: datasource=github-releases depName=casey/just
          just-version: "1.59.0"
      - run: just toolchains
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b # v2.89.0
        with:
          tool: cargo-llvm-cov@${{ env.CARGO_LLVM_COV_VERSION }}
      - name: Summarize coverage
        run: |
          {
            echo '```'
            just cov
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # The one check the ruleset requires: the matrix legs are named after their values, so requiring them
  # would break whenever a matrix changes.
  gate:
    if: always()
    needs: [check, deps]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every check passed
        env:
          CHECK: ${{ needs.check.result }}
          DEPS: ${{ needs.deps.result }}
        run: |
          [ "$CHECK" = success ] || { echo "::error::check: $CHECK"; exit 1; }
          [ "$DEPS" = success ] || { echo "::error::deps: $DEPS"; exit 1; }
