name: rapx

# RAPx static analysis: weekly and manual, outside the gate. Findings go to the job summary;
# a failure usually means the pinned RAPx and nightly (justfile) need a bump.
on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/rapx.yml

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  rapx:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Z3
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libz3-dev
      # Caches ~/.cargo/bin, so `rapx-install` skips the build until the pin changes.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: rapx-${{ hashFiles('justfile') }}
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          # renovate: datasource=github-releases depName=casey/just
          just-version: "1.59.0"
      - run: just rapx-install
      - name: Use-after-free, double free, leaks
        run: |
          {
            echo '## RAPx check'
            echo '```'
            just rapx 2>&1
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Optimization hints
        run: |
          {
            echo '## RAPx opt'
            echo '```'
            just rapx opt 2>&1
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
