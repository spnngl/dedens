name: renovate

# Validates renovate.json5 when it or this workflow changes.
on:
  push:
    branches:
      - main
    paths:
      - renovate.json5
      - .github/workflows/renovate.yml
  pull_request:
    paths:
      - renovate.json5
      - .github/workflows/renovate.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  renovate:
    permissions:
      contents: read
    uses: spnngl/.github/.github/workflows/renovate.yml@main
