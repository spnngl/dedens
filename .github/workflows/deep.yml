name: deep

# The slow checks, informational and outside the gate as `mutants.yml` is (D103): `loom` is loom's model of dedensd's
# reload wake-up and query flights (`just loom`, D135); `sim` runs the simulation scenarios under 100 random seeds,
# a job per scenario file, and a failure prints the `DEDENS_SIM_SEED=<n>` that replays it (`just sim`, D133);
# `careful` runs the tests on a checked standard library under AddressSanitizer, a job per package (`just careful
# address`, D144).
on:
  pull_request:

# A new push cancels the running check.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Each job grants only what it needs.
permissions: {}

env:
  CARGO_TERM_COLOR: always
  # renovate: datasource=crate depName=cargo-careful
  CARGO_CAREFUL_VERSION: "0.4.10"

jobs:
  loom:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          # renovate: datasource=github-releases depName=casey/just
          just-version: "1.59.0"
      - run: just toolchains
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: . -> target/loom
      - run: just loom
  # One sim job per scenario file: all of them in one job outlast 30 minutes on a slow runner.
  scenarios:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - id: list
        run: echo "list=$(basename -s .rs crates/dedens-sim/tests/*.rs | jq -Rnc '[inputs]')" >> "$GITHUB_OUTPUT"
  sim:
    needs: scenarios
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJSON(needs.scenarios.outputs.list) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          # renovate: datasource=github-releases depName=casey/just
          just-version: "1.59.0"
      # The stable toolchain alone: the scenarios need no nightly.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.test }}
      - run: just sim 100 "$TEST"
        env:
          TEST: ${{ matrix.test }}
  # One careful job per package: the workspace's tests under AddressSanitizer outlast any one job.
  packages:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # The workspace's members are `crates/*` and `apps/*`, each folder named as its package.
      - id: list
        run: echo "list=$(basename -a crates/* apps/* | jq -Rnc '[inputs]')" >> "$GITHUB_OUTPUT"
  careful:
    needs: packages
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.packages.outputs.list) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          # renovate: datasource=github-releases depName=casey/just
          just-version: "1.59.0"
      - run: just toolchains
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: . -> target/careful
          key: ${{ matrix.package }}
      - uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
        with:
          tool: cargo-careful@${{ env.CARGO_CAREFUL_VERSION }}
      - run: just careful address "$PACKAGE"
        env:
          PACKAGE: ${{ matrix.package }}
