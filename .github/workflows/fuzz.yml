name: fuzz

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "fuzz/**"
      - "crates/**"
      - "justfile"
      - ".github/workflows/fuzz.yml"

# Each job grants only what it needs.
permissions: {}

jobs:
  # Stable: the captured responses plus truncated and bit-flipped variants through every target.
  smoke:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          # renovate: datasource=github-releases depName=casey/just
          just-version: "1.59.0"
      - run: just toolchains
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: fuzz
      - run: just fuzz-smoke

  # Pinned nightly with real libFuzzer: scheduled and manual runs only.
  fuzz:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          # renovate: datasource=github-releases depName=casey/just
          just-version: "1.59.0"
      - run: just toolchains
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: fuzz
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: cargo-fuzz
      - name: Run every target for 60 seconds from the captured responses
        run: just fuzz-all 60
      - name: Keep the crashing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
