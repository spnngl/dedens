name: release

# A tag `v*` pushed by the human publishes the static musl binaries and the dedensd image (D153), once the gate of
# `ci.yml` passed on the tagged commit. By hand with `publish` off, everything is built and attested but nothing is
# released or pushed: the way to try this on a fork. Only a tag publishes: a name of a branch is no image tag, and the
# release needs the tag. Plain versions only (no `+`, which Docker refuses in a tag).
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      publish:
        description: "Create the GitHub release and push the image"
        type: boolean
        default: false

# One release at a time per ref, never cancelled half way.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Each job grants only what it needs.
permissions: {}

env:
  # What publishing means: the tag was pushed, or the input was ticked.
  PUBLISH: ${{ github.ref_type == 'tag' && (github.event_name == 'push' || inputs.publish) }}

jobs:
  gate:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  # `just release` on each architecture's own runner: the binaries built twice in fresh containers and compared (D153).
  binaries:
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            arch: x86_64
          - os: ubuntu-26.04-arm
            arch: aarch64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          # renovate: datasource=github-releases depName=casey/just
          just-version: "1.59.0"
      - run: just release
      # Sorted, with no owner or time, so that the same binaries make the same archive.
      - name: Archive
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          name="dedens-${GITHUB_REF_NAME//\//-}-$ARCH-unknown-linux-musl"
          mkdir "$name"
          cp dist/dedensd dist/dedens LICENSE "$name/"
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner -cf - "$name" | gzip -n > "dist/$name.tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: archive-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  # The checksums, the build provenance of every archive, and the GitHub release.
  release:
    needs: [binaries, image]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write # the release
      id-token: write # the attestation's signature
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: archive-*
          merge-multiple: true
          path: dist
      - run: cd dist && sha256sum -- *.tar.gz | tee SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes

  # The image of each architecture, built and pushed by its own runner.
  image:
    needs: binaries
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            arch: x86_64
          - os: ubuntu-26.04-arm
            arch: aarch64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          # renovate: datasource=github-releases depName=casey/just
          just-version: "1.59.0"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: archive-${{ matrix.arch }}
          path: archive
      - run: just image
      # The user, the directory it writes, and the very `dedensd` of the attested archive.
      - name: Check
        run: |
          [ "$(docker inspect -f '{{.Config.User}}' localhost/dedensd)" = 10001:10001 ]
          docker run --rm localhost/dedensd --version
          id="$(docker create localhost/dedensd)"
          docker export "$id" | tar -tvf - | grep -q '10001/10001.* var/cache/dedensd/$'
          docker cp "$id:/dedensd" dedensd-image
          docker rm "$id"
          tar -xzf archive/*.tar.gz --strip-components=1 -C archive
          cmp dedensd-image archive/dedensd
      - if: env.PUBLISH == 'true'
        env:
          ARCH: ${{ matrix.arch }}
          TOKEN: ${{ github.token }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/dedensd:${GITHUB_REF_NAME//\//-}-$ARCH"
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag localhost/dedensd "$image"
          docker push "$image"

  # Both architectures under one tag, attested.
  manifest:
    needs: image
    # `env` is not available in a job's `if`, `github` and `inputs` are.
    if: github.ref_type == 'tag' && (github.event_name == 'push' || inputs.publish)
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      packages: write
      id-token: write
      attestations: write
    steps:
      - id: push
        env:
          TOKEN: ${{ github.token }}
        run: |
          name="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/dedensd"
          version="${GITHUB_REF_NAME//\//-}"
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx imagetools create -t "$name:$version" "$name:$version-x86_64" "$name:$version-aarch64"
          digest="$(docker buildx imagetools inspect "$name:$version" --format '{{.Manifest.Digest}}')"
          [ -n "$digest" ]
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
