# cargo-mutants (D103): run with `just mutants` or `just mutants-diff`, never bare.
# Test with every feature, so the tests behind `metrics` and `serde` see their mutants.
all_features = true
# nextest: dedensd's suite takes half the time; it runs no doctests (D103).
test_tool = "nextest"
# Mutants no test can observe, or that hang the tests (a timeout costs 240 s each). Matched by file, change and
# function, never by line, so an edit elsewhere keeps them matching; a function made generic matches with or without
# its parameters (`Client(<N>)?`). Checked 2026-11-03 at 92db76d.
exclude_re = [
  # `Debug` output is for logs and failing tests: no test reads it.
  '<impl (fmt::)?Debug for ',
  # Kani's proofs, in a `proofs` module beside the code they reach or dedens-proto's `src/proofs.rs`, built only
  # under `cfg(kani)` and checked by `just kani` (D145, D179).
  '\bproofs(::|\.rs:)',
  # A pointer's offset: its high byte shifted holds no bit of the low byte, so `|` and `^` are the same.
  'name\.rs:\d+:\d+: replace \| with \^ in (scan|unpack)$',
  # Reading more than a stream holds is still refused by the length check below; the other changes hang the read.
  'quic\.rs:\d+:\d+: replace (- with \+|\+ with [-*]|> with ==) in read_message$',
  # A name ending in a dot under a search list builds `name..domain`, which fails to parse: the same single name.
  'replace \|\| with && in ResolvConf::candidates',
  # Equal `Instant`s, an idle timeout equal to the current one: neither happens in a test.
  'replace < with <= in State::stalled',
  'tcp\.rs:\d+:\d+: replace < with <= in read$',
  # Dropping the stream, or both halves, right after closes it too, the FIN sent all the same: dedens-sim's write
  # half too, which turmoil closes when dropped, right after its close.
  'replace <impl Outbound for (TcpStream|Half<W>|SimWrite)>::close with \(\)',
  # dedensd's entry for the simulation: only dedens-sim's `serving` family calls it, and cargo-mutants runs the tests
  # of the mutated package alone (D182).
  'dedensd/src/serve/mod\.rs:\d+:\d+: replace simulated(<N>)? with \(\)$',
  # The fuzzing entry runs `lookups` for its panics and drops what it returns, which `-x` only changes.
  'dedens/src/lib\.rs:\d+:\d+: delete ! in parse_args$',
  # A receive answering at once with a datagram of another ID, or none, never awaits: the client drops it and receives
  # again, so the test hangs, the mutant seen only as a timeout (12 min a run).
  'udp\.rs:\d+:\d+: replace UdpQuery(<N>)?::recv -> io::Result<Option<Vec<u8>>> with Ok\(Some\(vec!\[[01]?\]\)\)$',
  # The default trace hook does nothing: its body only marks the argument used.
  'io\.rs:\d+:\d+: replace Io::sending with \(\)$',
  # How queries are batched into one write is not seen by the server; equal `Instant`s never happen.
  'net/src/tcp\.rs:\d+:\d+: replace < with (<=|==|>) in write$',
  # `Same` hashes `u64` keys through `write_u64`; `write` is never called.
  '<impl Hasher for Same>::write( with |$)',
  # The label counts only save work (D110): a count held with no name, or no skip of a name shorter than the shortest
  # blocked one, finds nothing in the hashes either.
  'replace LabelCounts::(holds -> bool with true|shortest -> Option<u32> with Some\([01]\))',
  # A text's empty set of hashes adds no hash, only a label count, which finds nothing in the hashes either.
  'replace > with >= in Names::included$',
  # A reading's two sets are made together and cloned together: one is never shared without the other.
  'replace && with \|\| in Names::same$',
  # The review: an answer with no DNAME holds nothing to read after the CNAME of a hop (a second CNAME of a name is
  # ignored), and one of DNAMEs only has no CNAME to stop at. By column too: the function's other `==` is caught.
  'blocklist/mod\.rs:\d+:54: replace == with != in <impl Reviewer for Blocklist>::review$',
  # A hop that starts at the CNAME the last one followed, not after it, finds the same: that CNAME is of the name
  # before (a loop to itself aside, whose name's second CNAME RFC 1034 §3.6.2 forbids).
  'replace \+ with \* in <impl Reviewer for Blocklist>::review$',
  # The name hash (D112): or-ing the product's halves only biases its bits, which names are compared in full past.
  # By column: the function's other `^` is caught.
  'name_table\.rs:\d+:32: replace \^ with \| in mix$',
  # A label of 8 bytes is one word either way; one of a multiple of 8 mixes its last word twice, the same for
  # every name; `w << 8` has no low bits for `|` and `^` to tell apart.
  'name_table\.rs:\d+:\d+: replace (> with >=|< with <=|\| with \^) in fold$',
  # The midpoint stays in `low..high` for `low` of at least LONGEST_FIRST: the search finds the same suffix, in
  # more lookups.
  'wire/mod\.rs:\d+:\d+: replace - with / in Writer<.a>::put_name_found$',
  # Bounds that no longer close in, `low` left at `mid` or the midpoint outside `low..high`: the search never ends.
  # By column: the function's other `<` and `+` are caught. The midpoint's `+` made `*` goes too, though caught: it has
  # the column of `mid + 1`'s.
  'wire/mod\.rs:\d+:23: replace < with <= in Writer<.a>::put_name_found$',
  'wire/mod\.rs:\d+:31: replace \+ with [-*] in Writer<.a>::put_name_found$',
  'wire/mod\.rs:\d+:\d+: replace (- with \+|/ with %) in Writer<.a>::put_name_found$',
  # Zeros read without consuming a byte: a decoding loop never reaches the end of its input.
  'wire/mod\.rs:\d+:\d+: replace Reader<.a>::(array -> .* with Ok\(\[0; N\]\)|u16 -> .* with Ok\(0\))$',
  # A pointer's target is below POINTER_LIMIT, its two top bits clear: `0xC000 ^ target` is `0xC000 | target`.
  'wire/mod\.rs:\d+:\d+: replace \| with \^ in Writer<.a>::(put_owner|put_name_found)$',
  # The room left is at least 501 bytes, far above `Cache::MIN_OUT`.
  'server/src/cache\.rs:\d+:\d+: replace < with (==|<=) in look$',
  # Read by dedensd only, whose tests do not run for a mutant of dedens-server.
  'replace Pipeline::stages -> &\[Stage\] with ',
  # The records were filtered to fit already; the flag, opcode and rcode bits are disjoint.
  'reply\.rs:\d+:\d+: replace (\+ with -|\| with \^) in Client<.q>::answer$',
  # A stored response never has the TC flag: a truncated one is refused at build and a patch never sets it.
  'replace \| with \^ in Response::serve$',
  # At the limit both branches give the same value: the insecure TTL, and the default entry size.
  'replace < with <= in Config::(insecure_ttl|entry_limit)$',
  # Read only when root drops to `user` (D122): seen by the #[ignore]d root tests of privileges.rs, outside this job.
  'config/sources\.rs:\d+:\d+: (delete ! in Downloads::written_dir|replace Downloads::written_dir -> .* with None)$',
  # target is given CNAME or DNAME sets only, and a CNAME's RDATA always decodes as RData::Cname, never opaque.
  'section\.rs:\d+:\d+: replace match guard set\.rtype\(\) == RecordType::DNAME with true in target$',
  # Equal values: either is the lesser, or the greater.
  'config\.rs:\d+:\d+: replace (< with <= in lesser|> with >= in greater)$',
  # A plugin's stage index is never the cache stage's: `<` and `<=` agree.
  'pipeline/finish\.rs:\d+:\d+: replace < with <= in Finish<._>::plain$',
  # Zeroing a dropped secret is memory hygiene: reading the bytes after the drop takes `unsafe`, no test's.
  'cookie\.rs:\d+:\d+: replace <impl Drop for Secret>::drop with \(\)$',
  # `high << 4 | low`: the low nibble of the shifted one is clear, so `|`, `^` and `+` agree.
  'link\.rs:\d+:\d+: replace \| with \^ in decode$',
  # Without the `doc` feature only: not built under `all_features`, so no test sees a change.
  'client\.rs:\d+:\d+: replace discover -> Result<Vec<Vec<Box<\[u8\]>>>, ClientError> with ',
  # Configurations that go stale at the very `Instant` they are read or kept: equal `Instant`s never happen.
  'odoh/client\.rs:\d+:\d+: replace > with >= in Configs::(fresh|keep)$',
  # dedens-sim: a `read` that returns an empty or one-byte message makes the host loop on it without waiting, so the run
  # never ends (a timeout of the mutants run, not a failure).
  'framing\.rs:\d+:\d+: replace read -> io::Result<Vec<u8>> with ',
  # dedens-sim: a capture decoded and encoded again is the same message; no test asserts the reply's length (D112's
  # compression may differ from the capture's), so the shortcut for a reply that needs no cut and no cookie only
  # saves the work.
  'upstream\.rs:\d+:\d+: replace \|\| with && in Answers::answer$',
  # dedens-sim: turmoil's flush does nothing (it buffers no write), and its write half sends the FIN when dropped, which
  # it is right after the shutdown.
  'dedens-sim/src/io\.rs:\d+:\d+: replace <impl AsyncWrite for SimWrite>::(flush|shutdown) -> io::Result<\(\)> with Ok\(\(\)\)$',
  # dedens-sim: a local error of the exchange is an encoding failure, or a local socket error (bind failure, no
  # file descriptor), which no scenario can make and turmoil never produces: the resolver abandons the question for
  # it as `dedensd` does.
  'resolver\.rs:\d+:\d+: replace match guard error\.is_local\(\) with false in Shared::answer$',
  # dedens-sim: a connection whose reply could not be written is read on until the read fails too: the same end.
  'resolver\.rs:\d+:\d+: replace \|= with &= in connection$',
  # One UDP send more in flight than `UDP_SENDS`: no peer can tell how many replies go out in one submission.
  'serve/udp\.rs:\d+:\d+: replace < with <= in send_replies$',
  # A connection closed 10 s after `GOAWAY` or a nanosecond later: equal `Instant`s never happen.
  'serve/h3_budget\.rs:\d+:\d+: replace > with >= in Budget::check$',
  # D86: the flag keeps the flights of clients over UDP apart from those over a connection; inverted, it still does.
  'serve/upstream\.rs:\d+:\d+: replace == with != in answer$',
  # D121: the panic hook is process-wide, so no test sets it (it would race the other tests' panics); `Hooked::new`,
  # which decides what it does, is tested.
  'serve/isolate\.rs:\d+:\d+: replace hook with \(\)$',
  # dedensd: root only, tested by `tests/privileges.rs` under sudo in CI's own job, not by the mutants shards: the
  # groups of the user dropped to (Linux), and off Linux a function not built there.
  'privileges/unix\.rs:\d+:\d+: replace groups -> anyhow::Result<\(\)> with Ok\(\(\)\)$',
]
# Built only under `--cfg dedens_loom`, where `just loom` runs the tests that catch its mutants (D135); built only off
# Unix, where the mutants shards do not run. The test kit, test code as `tests/` is, which cargo-mutants never
# mutates: its mutants would only show which helpers the kit's own tests skip, the packages whose tests use it not
# being run for them (D161).
exclude_globs = [
  "crates/dedens-testkit/**",
  "apps/dedensd/src/sync/loom_slot.rs",
  "apps/dedensd/src/privileges/not_unix.rs",
]
