# cargo-mutants (D103): run with `just mutants` or `just mutants-diff`, never bare.
# Test with every feature, so the tests behind `metrics` and `serde` see their mutants.
all_features = true
# nextest: dedensd's suite takes half the time; it runs no doctests (D103).
test_tool = "nextest"
# Mutants no test can observe, or that hang the tests (a timeout costs 240 s each). Matched by file, change and
# function, never by line, so an edit elsewhere keeps them matching; a function made generic matches with or without
# its parameters (`Client(<N>)?`). Checked 2026-11-03 at 92db76d.
exclude_re = [
  # `Debug` output is for logs and failing tests: no test reads it.
  '<impl (std::)?(fmt::)?Debug for ',
  # Kani's proofs, in a `proofs` module beside the code they reach or dedens-proto's `src/proofs.rs`, built only
  # under `cfg(kani)` and checked by `just kani` (D145, D179).
  '\bproofs(::|\.rs:)',
  # A pointer's offset: its high byte shifted holds no bit of the low byte, so `|` and `^` are the same.
  'name\.rs:\d+:\d+: replace \| with \^ in (scan|unpack)$',
  # A stamp's properties: three flags each in a bit of its own, so `|` and `^` are the same.
  'stamp\.rs:\d+:\d+: replace \| with \^ in Properties::bits$',
  # The flags a root file opens with, `O_NOFOLLOW` and `O_NONBLOCK`, each in a bit of its own: the same again.
  'roots\.rs:\d+:\d+: replace \| with \^ in open$',
  # Reading more than a stream holds is still refused by the length check below; the other changes hang the read.
  'quic\.rs:\d+:\d+: replace (- with \+|\+ with [-*]|> with ==) in read_message$',
  # A name ending in a dot under a search list builds `name..domain`, which fails to parse: the same single name.
  'replace \|\| with && in ResolvConf::candidates',
  # An entry that never ends the text: each caller reads entries until `None` and keeps them, so the tests grow
  # without bound, past the machine's memory well before the timeout (three kernel panics on 2026-11-22).
  'lexer\.rs:\d+:\d+: replace Lexer<.t>::entry -> .* with Ok\(Some\((true|false)\)\)$',
  # An idle timeout equal to the current one: never happens in a test.
  'tcp\.rs:\d+:\d+: replace < with <= in read$',
  # Dropping the stream, or both halves, right after closes it too, the FIN sent all the same: dedens-sim's write
  # half too, which turmoil closes when dropped, right after its close.
  'replace <impl Outbound for (compio::net::TcpStream|Half<W>|SimWrite)>::close with \(\)',
  # dedensd's entry for the simulation: only dedens-sim's `serving` family calls it, and cargo-mutants runs the tests
  # of the mutated package alone (D182).
  'dedensd/src/(lib|serve/mod)\.rs:\d+:\d+: replace simulated(<N>)? with \(\)$',
  # The recurse stage's loop (D195) asks authoritative servers on port 53 at the root's addresses, which only
  # dedens-sim's Internet serves (its `recurse` tests): the same reason. What `ask` decides is `asked`'s, unit tested
  # with a send given (D195); `ask` adds the transport and the resolution's end only. What `drive` decides of an
  # outcome is `hand`'s, unit tested; `drive` adds the randomness, whose failures no test can bring, and the loop.
  'dedensd/src/serve/recurse\.rs:\d+:\d+: (replace (resolve|clock|drive|ask|send)(<N>)?( -> .*)? with .*|.* in (resolve|clock|drive|ask|send)(<N>)?)$',
  # Every plan but `Unprivileged` takes root, or a `user` naming the one running the tests, which no test sets: under
  # `Unprivileged` `drop_root` applies nothing and returns `Ok(None)` (D122).
  'dedensd/src/lib\.rs:\d+:\d+: replace drop_root -> .* with Ok\(None\)$',
  # The soft limit of open descriptors raised to the hard one (D195) shows past 1024 sockets, which no test opens;
  # `process` does that and sets the panic hook, which no test sets either (D121, `hook` below).
  'dedensd/src/lib\.rs:\d+:\d+: replace (process|descriptors) with \(\)$',
  'dedensd/src/lib\.rs:\d+:\d+: replace .* in descriptors$',
  # The same for the DNSCrypt provider's entry (D99): dedens-sim's `dnscrypt` test calls it.
  'dedensd/src/(lib|serve/mod)\.rs:\d+:\d+: replace simulated_dnscrypt(<N>)? (with \(\)|-> anyhow::Result<\(\)> with Ok\(\(\)\))$',
  # A key file is read in one `read` or a few: an interrupted read is retried, which no test makes a file do.
  'secret\.rs:\d+:\d+: replace (match guard error\.kind\(\) == io::ErrorKind::Interrupted with (true|false)|== with !=) in read_secret$',
  # `high << 4 | low`: the low nibble of the shifted one is clear, so `|`, `^` and `+` agree.
  'secret\.rs:\d+:\d+: replace \| with \^ in read_secret$',
  # Without the `dnscrypt` or `odoh` feature only: not built under `all_features`, so no test sees a change.
  'upstream\.rs:\d+:\d+: replace (dnscrypt|exchange_dnscrypt|exchange_oblivious)(<N>)? -> .* with Ok\(Default::default\(\)\)$',
  # The same for a relay of `relays` (D100) and an `odoh_proxy` (D185): a build without the feature refuses one by
  # name before it is read.
  'upstream\.rs:\d+:\d+: replace <impl TryFrom<String> for (Relay|OdohProxy)>::try_from -> Result<Self, String> with Ok\(Default::default\(\)\)$',
  # The fuzzing entry runs `lookups` for its panics and drops what it returns, which `-x` only changes.
  'dedens/src/lib\.rs:\d+:\d+: delete ! in parse_args$',
  # The fuzzing entry of `+tld`'s reader runs it for its panics; the fuzz target drops what it returns.
  'dedens/src/lib\.rs:\d+:\d+: replace parse_rdap -> anyhow::Result<\(\)> with Ok\(\(\)\)$',
  # A receive answering at once with a datagram of another ID, or none, never awaits: the client drops it and receives
  # again, so the test hangs, the mutant seen only as a timeout (12 min a run).
  'udp\.rs:\d+:\d+: replace UdpQuery(<N>)?::recv -> io::Result<Option<Vec<u8>>> with Ok\(Some\(vec!\[[01]?\]\)\)$',
  # The default trace hook does nothing: its body only marks the argument used.
  'io\.rs:\d+:\d+: replace Io::sending with \(\)$',
  # How queries are batched into one write is not seen by the server; equal `Instant`s never happen.
  'net/src/tcp\.rs:\d+:\d+: replace < with (<=|==|>) in write$',
  # `Same` hashes `u64` keys through `write_u64`; `write` is never called.
  '<impl Hasher for Same>::write( with |$)',
  # The label counts only save work (D110): a count held with no name, or no skip of a name shorter than the shortest
  # blocked one, finds nothing in the hashes either.
  'replace LabelCounts::(holds -> bool with true|shortest -> Option<u32> with Some\([01]\))',
  # A text's empty set of hashes adds no hash, only a label count, which finds nothing in the hashes either.
  'replace > with >= in Names::included$',
  # A reading's two sets are made together and cloned together: one is never shared without the other.
  'replace && with \|\| in Names::same$',
  # The review: an answer with no DNAME holds nothing to read after the CNAME of a hop (a second CNAME of a name is
  # ignored), and one of DNAMEs only has no CNAME to stop at. By column too: the function's other `==` is caught.
  'blocklist/mod\.rs:\d+:54: replace == with != in <impl Reviewer for Blocklist>::review$',
  # A hop that starts at the CNAME the last one followed, not after it, finds the same: that CNAME is of the name
  # before (a loop to itself aside, whose name's second CNAME RFC 1034 §3.6.2 forbids).
  'replace \+ with \* in <impl Reviewer for Blocklist>::review$',
  # The name hash (D112): or-ing the product's halves only biases its bits, which names are compared in full past.
  # By column: the function's other `^` is caught.
  'name_table\.rs:\d+:32: replace \^ with \| in mix$',
  # A label of 8 bytes is one word either way; one of a multiple of 8 mixes its last word twice, the same for
  # every name; `w << 8` has no low bits for `|` and `^` to tell apart.
  'name_table\.rs:\d+:\d+: replace (> with >=|< with <=|\| with \^) in fold$',
  # The midpoint stays in `low..high` for `low` of at least LONGEST_FIRST: the search finds the same suffix, in
  # more lookups.
  'wire/mod\.rs:\d+:\d+: replace - with / in Writer<.a>::put_name_found$',
  # Bounds that no longer close in, `low` left at `mid` or the midpoint outside `low..high`: the search never ends.
  # By column: the function's other `<` and `+` are caught. The midpoint's `+` made `*` goes too, though caught: it has
  # the column of `mid + 1`'s.
  'wire/mod\.rs:\d+:23: replace < with <= in Writer<.a>::put_name_found$',
  'wire/mod\.rs:\d+:31: replace \+ with [-*] in Writer<.a>::put_name_found$',
  'wire/mod\.rs:\d+:\d+: replace (- with \+|/ with %) in Writer<.a>::put_name_found$',
  # Zeros read without consuming a byte: a decoding loop never reaches the end of its input.
  'wire/mod\.rs:\d+:\d+: replace Reader<.a>::(array -> .* with Ok\(\[0; N\]\)|u16 -> .* with Ok\(0\))$',
  # A pointer's target is below POINTER_LIMIT, its two top bits clear: `0xC000 ^ target` is `0xC000 | target`.
  'wire/mod\.rs:\d+:\d+: replace \| with \^ in Writer<.a>::(put_owner|put_name_found)$',
  # The room left is at least 501 bytes, far above `Cache::MIN_OUT`.
  'server/src/cache\.rs:\d+:\d+: replace < with (==|<=) in look$',
  # Read by dedensd only, whose tests do not run for a mutant of dedens-server.
  'replace Pipeline::stages -> &\[Stage\] with ',
  # The records were filtered to fit already; the flag, opcode and rcode bits are disjoint.
  'reply\.rs:\d+:\d+: replace (\+ with -|\| with \^) in Client<.q>::answer$',
  # A stored response never has the TC flag: a truncated one is refused at build and a patch never sets it.
  'replace \| with \^ in Response::serve$',
  # Fast paths of the RRset's RDATA, measured (D193): without them the hash set finds the same duplicates and equality.
  'rrset\.rs:\d+:\d+: (replace > with >= in canonical|delete match arm \(\[a\], \[b\]\) in same_rdatas)$',
  # At the limit both branches give the same value: the insecure TTL, and the default entry size (`store.rs`).
  'replace < with <= in (Config::insecure_ttl|entry_limit)$',
  # D115: a `|` or `>` inside a block's plain scalar taken for a block scalar's header. The lines more indented after
  # it, its text then, are the plain scalar's continuation, where no placeholder starts a scalar either. By column:
  # the function's other `&&` is caught.
  'config/env\.rs:\d+:37: replace && with \|\| in Scan::char$',
  # Read only when root drops to `user` (D122): seen by the #[ignore]d root tests of privileges.rs, outside this job.
  'config/sources\.rs:\d+:\d+: (delete ! in Downloads::written_dir|replace Downloads::written_dir -> .* with None)$',
  # target is given CNAME or DNAME sets only, and a CNAME's RDATA always decodes as RData::Cname, never opaque.
  'section\.rs:\d+:\d+: replace match guard set\.rtype\(\) == RecordType::DNAME with true in target$',
  # Equal values: either is the lesser, or the greater.
  'config\.rs:\d+:\d+: replace (< with <= in lesser|> with >= in greater)$',
  # A plugin's stage index is never the cache stage's: `<` and `<=` agree.
  'pipeline/finish\.rs:\d+:\d+: replace < with <= in Finish<._>::keeps$',
  # Zeroing a dropped secret is memory hygiene: reading the bytes after the drop takes `unsafe`, no test's.
  'cookie\.rs:\d+:\d+: replace <impl Drop for Secret>::drop with \(\)$',
  # `high << 4 | low`: the low nibble of the shifted one is clear, so `|`, `^` and `+` agree.
  'link\.rs:\d+:\d+: replace \| with \^ in decode$',
  # `ext << 4 | low`, `low` masked to 4 bits: the shifted byte's low nibble is clear, so `|` and `^` agree.
  'codes\.rs:\d+:\d+: replace \| with \^ in Rcode::extended$',
  # RDATA without names, written again from its typed form, is the bytes it was read from: one value has one form
  # (D9). The copy only saves the work.
  'record\.rs:\d+:\d+: replace match guard RData::may_hold_compressed_names\(rtype\) with true in WireRdata<.a>::into_owned$',
  # A constant hash keeps every map and set right, only slower; no test can tell.
  'record\.rs:\d+:\d+: replace <impl Hash for WireRdata<._>>::hash with \(\)$',
  'opaque\.rs:\d+:\d+: replace <impl Hash for Opaque<._>>::hash with \(\)$',
  # Without the `doc` feature only: not built under `all_features`, so no test sees a change.
  'client\.rs:\d+:\d+: replace discover -> Result<Vec<Vec<Box<\[u8\]>>>, ClientError> with ',
  # Configurations that go stale at the very `Instant` they are read or kept: equal `Instant`s never happen.
  'odoh/client\.rs:\d+:\d+: replace > with >= in Configs::(fresh|keep)$',
  # dedens-sim: a `read` that returns an empty or one-byte message makes the host loop on it without waiting, so the run
  # never ends (a timeout of the mutants run, not a failure).
  'framing\.rs:\d+:\d+: replace read -> io::Result<Vec<u8>> with ',
  # dedens-sim: a capture decoded and encoded again is the same message; no test asserts the reply's length (D112's
  # compression may differ from the capture's), so the shortcut for a reply that needs no cut and no cookie only
  # saves the work.
  'upstream\.rs:\d+:\d+: replace \|\| with && in Answers::answer$',
  # dedens-sim: turmoil's flush does nothing (it buffers no write), and its write half sends the FIN when dropped, which
  # it is right after the shutdown.
  'dedens-sim/src/io\.rs:\d+:\d+: replace <impl AsyncWrite for SimWrite>::(flush|shutdown) -> io::Result<\(\)> with Ok\(\(\)\)$',
  # dedens-sim: a local error of the exchange is an encoding failure, or a local socket error (bind failure, no
  # file descriptor), which no scenario can make and turmoil never produces: the resolver abandons the question for
  # it as `dedensd` does.
  'resolver\.rs:\d+:\d+: replace match guard error\.is_local\(\) with false in Shared::answer$',
  # dedens-sim: a connection whose reply could not be written is read on until the read fails too: the same end.
  'resolver\.rs:\d+:\d+: replace \|= with &= in connection$',
  # One UDP send more in flight than `UDP_SENDS`: no peer can tell how many replies go out in one submission.
  'serve/udp\.rs:\d+:\d+: replace < with <= in send_replies$',
  # A connection closed 10 s after `GOAWAY` or a nanosecond later: equal `Instant`s never happen.
  'serve/h3_budget\.rs:\d+:\d+: replace > with >= in Budget::check$',
  # D86: the flag keeps the flights of clients over UDP apart from those over a connection; inverted, it still does.
  'serve/upstream\.rs:\d+:\d+: replace == with != in answer$',
  # D121: the panic hook is process-wide, so no test sets it (it would race the other tests' panics); `Hooked::new`,
  # which decides what it does, is tested.
  'serve/isolate\.rs:\d+:\d+: replace hook with \(\)$',
  # D157: the report of a serving thread that failed (its runtime or a QUIC endpoint refused by the kernel, a task that
  # ended though supervised), which no test can bring about on sockets main has bound already.
  'dedensd/src/lib\.rs:\d+:\d+: replace Ending::served with \(\)$',
  # dedensd: root only, tested by `tests/privileges.rs` under sudo in CI's own job, not by the mutants shards: the
  # groups of the user dropped to (Linux), and off Linux a function not built there.
  'privileges/unix\.rs:\d+:\d+: replace groups -> anyhow::Result<\(\)> with Ok\(\(\)\)$',
  # A padding to the length the message already has: `<=` pushes the marker and `resize` cuts it again, `<` leaves
  # the message as it is, the same bytes.
  'dedens-dnscrypt/src/padding\.rs:\d+:\d+: replace < with <= in pad$',
  # A certificate kept to the very `Instant` its hour ends, or an `Instant` equal to the one it was chosen at: equal
  # `Instant`s never happen (D98).
  'dnscrypt\.rs:\d+:\d+: replace < with <= in Resolver::kept$',
  # D100: a loopback socket's receive fails with nothing but the port unreachable a test can bring about, so every
  # error taken as a refusal is the same to the tests.
  'dnscrypt\.rs:\d+:\d+: replace match guard error\.kind\(\) == io::ErrorKind::ConnectionRefused with true in udp_round$',
  # D101: the flag only names which of two bucket sets a query is charged to, TCP's or UDP's; inverted, the sets are
  # the same two with the names swapped.
  'serve/dnscrypt\.rs:\d+:\d+: replace == with != in Keys::open$',
  # D73: the DS records of a bucket grouped by digest type only spare digests; split into groups of one record (two at
  # the change of type), a key with DS records of two types still finds one, at the cost the `trusted_keys_one_tag` bench shows.
  'rrsig/trust\.rs:\d+:\d+: replace == with != in vouched$',
  # D154: built only for musl Linux, where `tests/huge_pages.rs` catches its mutants (`just musl`); the mutants shards
  # build for glibc.
  'dedensd/src/main\.rs:\d+:\d+: (replace huge_pages_off with \(\)|delete ! in huge_pages_off)$',
  # D194: an infra cache entry owns no allocation; a byte more each shows only against the store's private slot
  # cost, which `dedens-cache` tests.
  'infra_cache\.rs:\d+:\d+: replace <impl Cost for Entry>::cost -> usize with 1$',
  # D198: a minimised name that is a CNAME, in its zone, to a name that does not exist; no captured resolution has
  # one, and test data is real.
  'resolution/mod\.rs:\d+:\d+: replace match guard !chain\.is_empty\(\) with false in Resolution::went_on$',
  # D78: the smaller of the block's padding and the room left, the same when they are equal.
  'odoh/src/message\.rs:\d+:\d+: replace < with <= in block_padding$',
  # D78: what an ODoH field writes, which only sizes the buffers it is written to; another size grows them, or
  # wastes room, the bytes written the same.
  'odoh/src/wire\.rs:\d+:\d+: (replace Field<B>::encoded_len -> usize with [01]|replace \+ with \* in Field<B>::encoded_len)$',
  # D78, D179: the room an ODoH message or plaintext is allocated with, its parts summed by `buffer`; an empty
  # buffer, as Kani's proofs get, grows to the same bytes.
  'odoh/src/message\.rs:\d+:\d+: replace buffer -> Vec<u8> with vec!\[\]$',
  # D97: the capacity a DNSCrypt response packet is allocated with; another one only grows the packet, or wastes
  # room, the bytes written the same (the allocations are the `dnscrypt` bench's). `-` overflows, which tests see.
  'dnscrypt/src/resolver\.rs:\d+:\d+: (replace packet_capacity -> usize with [01]|replace (\+ with \*|\* with [+/]) in packet_capacity)$',
  # An NS lookup of a DS's ancestor answered through a CNAME: no capture holds an alias above a cut, and the DS
  # then asked of the alias's servers is still judged by the validator (D197).
  'resolution/mod\.rs:\d+:\d+: replace match guard chain\.is_empty\(\) with true in Resolution::cut$',
  # A DS whose signature verifies as a wildcard expansion: a DS at a wildcard is meaningless (RFC 4592 §4.6), no
  # capture has one, and test data is real.
  'validator/chain\.rs:\d+:\d+: replace match guard verified\.wildcard\.is_none\(\) with true in Validation::cut_in$',
  # A log line only, of dedensd's RFC 5011 state (D200): `say` warns of the root keys followed disagreeing with the
  # downloaded anchors, trusted either way. The conditions that feed it are in `Kept::anchors` and `newly_full`,
  # whose tests catch their mutants.
  'rollover\.rs:\d+:\d+: replace say with \(\)$',
  # The state read at exactly `Rollover::MAX_LEN` bytes: lossy rather than strict UTF-8, which only changes the
  # message of a state set aside either way (a replacement character is no state, and the text outgrows the bound).
  'dedensd/src/rollover\.rs:\d+:\d+: replace > with >= in read$',
  # A failure held costs the slot the store counts and no byte of its own: a byte more or less moves no bound a test
  # can read (D199).
  'negative\.rs:\d+:\d+: replace <impl Cost for Hold>::cost -> usize with 1$',
  # The closest encloser of an NSEC proof is the longest name above the one asked that the covering record's owner or
  # next name is within: the captured zones' records have both within it, so `||` and `&&` pick the same name, and the
  # wildcard hashed for a name that matched (`at == 0`) adds a record the proof ignores, which a `>=` there adds too.
  'aggressive\.rs:\d+:\d+: replace \|\| with && in nsec$',
  'aggressive\.rs:\d+:\d+: replace > with >= in nsec3$',
  # The span of the wildcard of a captured NSEC3 chain is the span of the name asked, whose record is kept already:
  # leaving the wildcard unhashed finds the same records. No capture has them apart, and test data is real.
  'aggressive\.rs:\d+:\d+: replace > with (<|==) in nsec3$',
  # Held back by the filters of `cached_denial`, which skip a NODATA for ANY (one entry of the key of an NXDOMAIN)
  # whether or not `denial_key` stores it.
  'resolution/mod\.rs:\d+:\d+: replace match guard question\.qtype != RecordType::ANY with true in denial_key$',
  # `advance` holds no failure after a limit was reached in an address lookup (`self.limit`) nor after a bogus
  # verdict made the resolution shun the servers that answered (`self.retries`). A failure of the kinds it holds
  # with either set is in no capture (a lookup that runs out of queries ends with `Failure::Limit`, a bogus retry
  # ends through `self.bogus`), so both set at once is no more observable, and test data is real.
  'resolution/mod\.rs:\d+:\d+: replace \|\| with && in Resolution::advance$',
  # A set of an NSEC3 hash other than SHA-1 and of more than 150 iterations at once (RFC 9276 §3.2): no capture has
  # one, and test data is real.
  'rrset_cache\.rs:\d+:\d+: replace && with \|\| in RrsetCache::index$',
  # An entry whose size is exactly the limit: one byte more is refused, one less is stored, as the test reads it.
  'rrset_cache\.rs:\d+:\d+: replace > with >= in RrsetCache::insert_negative$',
  # A key longer than the longest: only a name over 255 octets would fill it, which no name is. The `$` anchors it to
  # the module scope, where only the arithmetic of `KEY_LEN` is: a function's mutants end in ` in <fn>`.
  'rrset_cache\.rs:\d+:\d+: replace \+ with [-*]$',
  # The guard of `Hold::again` against a failure heard before the hold began: `again` is called only after `active`
  # found no hold, so a resolution begun before another's failure started the hold is the only way in, and the
  # harness steps one resolution at a time.
  'negative\.rs:\d+:\d+: replace (<|-) with [>+] in Hold::again$',
  # Which shard a zone is in: a keyed hash, so no name is in a given one (D199): every zone in shard 0 passes.
  'spans\.rs:\d+:\d+: replace >> with << in Spans::shard$',
  # The share's boundary: a zone of exactly the share's bytes is evicted by `>=`, kept by `>`, and no test builds a
  # zone of exactly the share (the figure is an estimate of the heap, D199).
  'spans\.rs:\d+:\d+: replace > with >= in Spans::add$',
  # The journal's directory sync: what it adds is a rename on disk after a power loss, which no test can cut
  # (D207); and its fallback for a path with no directory part, the working directory, which is the process's and
  # not a test's to change under threads.
  'journal/mod\.rs:\d+:\d+: (replace sync_directory -> io::Result<\(\)> with Ok\(\(\)\)|delete ! in sync_directory)$',
]
# Built only under `--cfg dedens_loom`, where `just loom` runs the tests that catch its mutants (D135); built only off
# Unix, where the mutants shards do not run. The test kit, test code as `tests/` is, which cargo-mutants never
# mutates: its mutants would only show which helpers the kit's own tests skip, the packages whose tests use it not
# being run for them (D161).
exclude_globs = [
  "crates/dedens-testkit/**",
  "apps/dedensd/src/sync/loom_slot.rs",
  "apps/dedensd/src/privileges/not_unix.rs",
]
