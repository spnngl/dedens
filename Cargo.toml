[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/spnngl/dedens"
publish = false

[workspace.dependencies]
# D32: the CLI. anstream strips the colors of anstyle where the terminal or NO_COLOR refuses them.
anstream = "1.0.0"
anstyle = "1.0.14"
anyhow = "1.0.104"
assert_cmd = "2.2.2"
clap = { version = "4.6.7", features = ["derive"] }
# D4, D26: io_uring on Linux, falling back to polling where io_uring is refused; kqueue on macOS. D60: TLS by
# rustls with ring, QUIC by quinn-proto. D82: HTTP/3 by h3.
compio = { version = "0.19.2", default-features = false, features = [
  "bytes",
  "h3",
  "io-uring",
  "net",
  "polling",
  "quic",
  "ring",
  "runtime",
  "rustls",
  "time",
] }
# D71: the RFC examples' base64, base32hex and hex in the crypto tests; the lock has it already.
data-encoding = "2.11.1"
dedens-cache = { path = "crates/dedens-cache" }
dedens-dnssec = { path = "crates/dedens-dnssec" }
dedens-net = { path = "crates/dedens-net" }
dedens-odoh = { path = "crates/dedens-odoh" }
dedens-plugins = { path = "crates/dedens-plugins" }
dedens-proto = { path = "crates/dedens-proto" }
dedens-scenario = { path = "crates/dedens-scenario" }
dedens-server = { path = "crates/dedens-server" }
divan = "0.1.21"
domain = { version = "0.12.3", default-features = false, features = ["std"] }
# D104: dedensd's tests compress a list to serve it with `Content-Encoding: gzip`, which its downloads do not decode.
flate2 = { version = "1.1.10", default-features = false, features = [
  "rust_backend",
] }
flume = { version = "0.12.0", default-features = false, features = ["async"] }
# dedensd: the lock its tasks take turns with on a UDP socket's stream of datagrams; D60: a TLS stream split in
# halves locked only while polled. compio depends on it already.
futures-util = { version = "0.3.34", default-features = false, features = [
  "io",
  "std",
] }
# D27: query IDs and client cookies; D133: the random seeds of the simulation tests.
getrandom = "0.4.3"
hickory-proto = { version = "0.26.3", default-features = false }
# D82: the request and response types of DoH, shared by `h2` and `h3`.
http = "1.5.0"
# D78: HPKE (RFC 9180) for ODoH, with only the suite RFC 9230 §9 requires: X25519, HKDF-SHA256, AES-128-GCM.
hpke = { version = "0.15.1", default-features = false, features = [
  "aes",
  "alloc",
  "x25519",
] }
# D32: Unicode names to A-labels (UTS 46), and the scripts of their labels.
idna = "1.1.0"
insta = "1.49"
# D91: IP networks (`prefix-trie`'s key type) of the client access lists.
ipnet = "2.12.2"
# D135: dedensd's loom tests, under `--cfg dedens_loom` only.
loom = { version = "0.7.2", features = ["futures"] }
metrics = "0.24.6"
metrics-util = { version = "0.20.4", default-features = false }
# D122: dedensd's privilege drop (`setuid`, `setgid`, `initgroups`, user and group lookup, `PR_SET_NO_NEW_PRIVS`), the
# libc calls without `unsafe` of our own. Its `setuid` is libc's, which changes every thread.
nix = { version = "0.31.3", default-features = false, features = [
  "process",
  "user",
] }
predicates = "3.1.4"
# D91: the longest-prefix tree of the client access lists.
prefix-trie = "0.10.1"
# D113: SipHash-2-4, the MAC of RFC 9018 server cookies.
siphasher = "1.0.4"
proptest = "1.12"
# D71: DNSSEC signature checks and digests; compio's TLS already builds it (the "ring" feature above).
ring = "0.17.14"
# D60: certificates made by the DNS over TLS tests, none checked in.
rcgen = { version = "0.14.10", default-features = false, features = [
  "pem",
  "ring",
] }
# D60: the OS trust store for DNS over TLS, as ureq's for the list downloads.
rustls-platform-verifier = "0.7.1"
# D36: query files and the JSON and YAML output (D37).
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = { version = "2.0.0", default-features = false, features = [
  "deserialize",
  "serialize",
] }
serde_json = "1.0.154"
# D55: dedensd's reload on SIGHUP; the handler stays installed between signals, unlike compio's.
signal-hook = { version = "0.4.5", default-features = false, features = [
  "iterator",
] }
# D42: SO_REUSEPORT, one socket per thread ("all" has it).
socket2 = { version = "0.6.5", features = ["all"] }
# D116: the cache's memory tests count the bytes the allocator holds, without `unsafe` of our own.
stats_alloc = "0.1.10"
# D136: constant-time compare of server cookies; rustls already builds it.
subtle = "2.6.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
# D133: the simulation tests' tasks and clock; turmoil runs a current-thread runtime per host.
tokio = { version = "1.54.1", default-features = false }
# D30: diagnostics of net, the CLI and dedensd; the CLI prints them as text under -v, dedensd as JSON ("json"
# there), without env-filter and its regexes.
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = [
  "ansi",
  "fmt",
  "std",
] }
# D133: the simulated network the simulation tests run the sans-IO cores on; hosts crash and bounce, links partition.
turmoil = "0.7.2"
unicode-script = "0.5.8"
# D57: dedensd's list downloads, blocking on a thread of their own; the OS trust store ("platform-verifier"). No
# "gzip", see D104.
ureq = { version = "3.5.0", default-features = false, features = [
  "platform-verifier",
  "rustls",
] }
# D59: fixed wire layouts (header, record and question fields) read and written in place, without unsafe.
zerocopy = { version = "0.8.63", features = ["derive"] }
# D78: ODoH secrets (the exporter secret, the plaintext of a query, the response keys) wiped when dropped.
zeroize = "1.9.1"

[workspace.lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"
# D135: dedensd's own cfg for loom: `--cfg loom` also switches tokio, event-listener and concurrent-queue to loom's
# types.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(dedens_loom)"] }
# docs/decisions.md D15: each crate root forbids unsafe code; a crate with a measured hot path swaps its `forbid`
# for this `deny` and allows it in that module only, with `// SAFETY:` comments and a Miri job.
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
# selected restriction
allow_attributes_without_reason = "warn"
clone_on_ref_ptr = "warn"
dbg_macro = "warn"
multiple_unsafe_ops_per_block = "warn"
panic = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"
unwrap_used = "warn"

# No `panic = "abort"`: dedensd catches the panic of a task and of a listener, which needs unwinding (D121).
[profile.release]
lto = "fat"
codegen-units = 1
strip = true

# `just loom` (D135): the release code, built in seconds not minutes, with the assertions on.
[profile.loom]
inherits = "release"
lto = false
codegen-units = 16
debug-assertions = true
overflow-checks = true
strip = false

# `cargo bench` builds with this profile; keep symbols for profilers.
[profile.bench]
strip = false
debug = "line-tables-only"
