[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/spnngl/dedens"
publish = false

[workspace.dependencies]
# D4, D26: io_uring on Linux, falling back to polling where io_uring is refused; kqueue on macOS.
compio = { version = "0.19.2", default-features = false, features = [
  "io-uring",
  "net",
  "polling",
  "runtime",
  "time",
] }
dedens-cache = { path = "crates/dedens-cache" }
dedens-net = { path = "crates/dedens-net" }
dedens-proto = { path = "crates/dedens-proto" }
dedens-scenario = { path = "crates/dedens-scenario" }
divan = "0.1.21"
domain = { version = "0.12.3", default-features = false, features = ["std"] }
flume = { version = "0.12.0", default-features = false, features = ["async"] }
# D27: query IDs and client cookies.
getrandom = "0.4.3"
hickory-proto = { version = "0.26.3", default-features = false }
insta = "1.49"
metrics = "0.24.6"
metrics-util = { version = "0.20.4", default-features = false }
proptest = "1.12"
thiserror = "2.0"

[workspace.lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"
# docs/decisions.md D15: each crate root forbids unsafe code; a crate with a measured hot path swaps its `forbid`
# for this `deny` and allows it in that module only, with `// SAFETY:` comments and a Miri job.
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
# selected restriction
allow_attributes_without_reason = "warn"
clone_on_ref_ptr = "warn"
dbg_macro = "warn"
multiple_unsafe_ops_per_block = "warn"
panic = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"
unwrap_used = "warn"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true

# `cargo bench` builds with this profile; keep symbols for profilers.
[profile.bench]
strip = false
debug = "line-tables-only"
