# A dedensd that serves DNSCrypt, and forwards to a DNSCrypt resolver by stamp, through relays (D99, D100).
listen: ['dnscrypt://127.0.0.1:8443']
dnscrypt:
  provider_name: 2.dnscrypt-cert.dns.example
  secret_key: /etc/dedensd/dnscrypt.key
  systems: [xchacha20, xsalsa20]
pipeline: [up]
stages:
  up:
    type: forward
    servers: ['sdns://AQMAAAAAAAAAETk0LjE0MC4xNC4xNDo1NDQzINErR_JS3PLCu_iZEIbq95zkSV2LFsigxDIuUso_OQhzIjIuZG5zY3J5cHQuZGVmYXVsdC5uczEuYWRndWFyZC5jb20']
    relays: ['sdns://gQ8xNDYuNzAuODIuMzo0NDM', '192.0.2.1:8443']
