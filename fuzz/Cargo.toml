[package]
name = "dedens-fuzz"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

# One target per parser of outside data. Each file in `fuzz_targets/` is a one-line shim over the matching
# function in `src/lib.rs`, which `cargo test --lib` also drives on stable with the captured responses in
# `crates/dedens-proto/tests/testdata/` and `crates/dedens-dnssec/tests/testdata/` as seeds (`just fuzz-smoke`).

[dependencies]
dedens-cache = { path = "../crates/dedens-cache" }
dedens-net = { path = "../crates/dedens-net" }
dedens-plugins = { path = "../crates/dedens-plugins" }
dedens-proto = { path = "../crates/dedens-proto" }
dedens-scenario = { path = "../crates/dedens-scenario" }
dedens-server = { path = "../crates/dedens-server" }
# The second implementation of `differential_hickory`; the same version as the workspace's (D14).
hickory-proto = { version = "0.26.3", default-features = false, features = [
  "std",
] }
libfuzzer-sys = "0.4"

[[bin]]
name = "decode_message"
path = "fuzz_targets/decode_message.rs"
test = false
doc = false
bench = false

[[bin]]
name = "read_query"
path = "fuzz_targets/read_query.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_zone"
path = "fuzz_targets/parse_zone.rs"
test = false
doc = false
bench = false

[[bin]]
name = "cache_insert"
path = "fuzz_targets/cache_insert.rs"
test = false
doc = false
bench = false

[[bin]]
name = "serve_query"
path = "fuzz_targets/serve_query.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_name"
path = "fuzz_targets/parse_name.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_query_file"
path = "fuzz_targets/parse_query_file.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_resolv_conf"
path = "fuzz_targets/parse_resolv_conf.rs"
test = false
doc = false
bench = false

[[bin]]
name = "differential_hickory"
path = "fuzz_targets/differential_hickory.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_lists"
path = "fuzz_targets/parse_lists.rs"
test = false
doc = false
bench = false

[workspace]

# The workspace's lint tables, copied: this crate is a workspace of its own.
[lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
allow_attributes_without_reason = "warn"
clone_on_ref_ptr = "warn"
dbg_macro = "warn"
multiple_unsafe_ops_per_block = "warn"
panic = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"
unwrap_used = "warn"
