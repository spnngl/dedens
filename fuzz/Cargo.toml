[package]
name = "dedens-fuzz"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

# One target per parser of outside data. Each file in `fuzz_targets/` is a one-line shim over the matching
# function of `src/`, which `cargo test --lib` also drives on stable with the captured responses in
# `testdata/proto/`, `testdata/dnssec/` and `testdata/odoh/` as seeds (`just fuzz-smoke`), with those of `seeds/`.

[dependencies]
# The parsers of the two binaries, through their libraries (D181), with every transport they read.
dedens = { path = "../apps/dedens", features = ["odoh", "doc"] }
dedens-cache = { path = "../crates/dedens-cache" }
dedens-dnscrypt = { path = "../crates/dedens-dnscrypt" }
dedens-dnssec = { path = "../crates/dedens-dnssec" }
dedens-net = { path = "../crates/dedens-net", features = ["odoh", "dnscrypt"] }
dedens-odoh = { path = "../crates/dedens-odoh" }
dedens-plugins = { path = "../crates/dedens-plugins" }
dedens-proto = { path = "../crates/dedens-proto" }
dedens-scenario = { path = "../crates/dedens-scenario" }
dedens-server = { path = "../crates/dedens-server" }
dedensd = { path = "../apps/dedensd", features = ["odoh", "doc"] }
# The second implementation of `differential_hickory`; the same version as the workspace's (D14).
hickory-proto = { version = "0.26.3", default-features = false, features = [
  "std",
] }
# The messages of `doh`; the same version as the workspace's (D82).
http = "1.5.0"
libfuzzer-sys = "0.4"
# The randomness of `odoh` and `dnscrypt`; the same version as the workspace's (D78).
rand_core = "0.10.1"

