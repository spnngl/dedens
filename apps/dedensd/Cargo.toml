[package]
name = "dedensd"
description = "A DNS server: a caching forwarder for now."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
clap.workspace = true
compio.workspace = true
dedens-cache = { workspace = true, features = ["serde"] }
dedens-dnssec.workspace = true
dedens-net = { workspace = true, features = ["tracing"] }
dedens-odoh = { workspace = true, optional = true }
dedens-plugins = { workspace = true, features = ["serde"] }
dedens-proto.workspace = true
dedens-server = { workspace = true, features = ["metrics", "serde"] }
flume.workspace = true
futures-util.workspace = true
getrandom.workspace = true
http.workspace = true
metrics.workspace = true
serde.workspace = true
serde-saphyr.workspace = true
socket2.workspace = true
tempfile.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["json"] }
ureq.workspace = true
zeroize = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
nix.workspace = true
signal-hook.workspace = true

[features]
# D69: experimental transports, off by default.
odoh = ["dedens-net/odoh", "dep:dedens-odoh", "dep:zeroize"]
doc = ["dedens-net/doc"]

[dev-dependencies]
dedens-scenario.workspace = true
flate2.workspace = true
metrics-util = { workspace = true, features = ["debugging"] }
rcgen.workspace = true
serde_json.workspace = true

# D135: `just loom`.
[target.'cfg(dedens_loom)'.dev-dependencies]
loom.workspace = true

[[bench]]
name = "doh3"
harness = false

[[bench]]
name = "udp"
harness = false

# D143: rcgen serves `crates/dedens-net/tests/common/certificates.rs`, a module of the tests and benches by `#[path]`,
# outside this package: cargo-shear reads none.
[package.metadata.cargo-shear]
ignored = ["rcgen"]

[lints]
workspace = true
