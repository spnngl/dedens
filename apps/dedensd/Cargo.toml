[package]
name = "dedensd"
description = "A DNS server: a caching forwarder for now."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
clap.workspace = true
compio.workspace = true
dedens-cache = { workspace = true, features = ["serde"] }
dedens-net = { workspace = true, features = ["tracing"] }
dedens-plugins = { workspace = true, features = ["serde"] }
dedens-proto.workspace = true
dedens-server.workspace = true
flume.workspace = true
futures-util.workspace = true
http.workspace = true
metrics.workspace = true
serde.workspace = true
serde-saphyr.workspace = true
socket2.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["json"] }
ureq.workspace = true

[target.'cfg(unix)'.dependencies]
signal-hook.workspace = true

[features]
# D69: experimental transports, off by default.
odoh = ["dedens-net/odoh"]
doc = ["dedens-net/doc"]

[dev-dependencies]
dedens-scenario.workspace = true
rcgen.workspace = true
serde_json.workspace = true
tempfile.workspace = true

[[bench]]
name = "doh3"
harness = false

[lints]
workspace = true
