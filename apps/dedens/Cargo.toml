[package]
name = "dedens"
description = "A dig-like DNS client."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
anstream.workspace = true
anstyle.workspace = true
anyhow.workspace = true
clap.workspace = true
compio.workspace = true
dedens-dnssec.workspace = true
dedens-net = { workspace = true, features = ["tracing"] }
dedens-proto.workspace = true
dedens-scenario = { workspace = true, features = ["clap"] }
idna.workspace = true
serde-saphyr.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
unicode-script.workspace = true

# D154: the global allocator on musl, `src/main.rs`.
[target.'cfg(target_env = "musl")'.dependencies]
mimalloc.workspace = true

[features]
# D69: experimental transports, off by default.
odoh = ["dedens-net/odoh"]
doc = ["dedens-net/doc"]

[dev-dependencies]
assert_cmd.workspace = true
clap_mangen.workspace = true
dedens-odoh.workspace = true
dedens-testkit = { workspace = true, features = ["certificates"] }
http.workspace = true
insta.workspace = true
predicates.workspace = true
serde.workspace = true
tempfile.workspace = true

[lints]
workspace = true
