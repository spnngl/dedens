[package]
name = "dedens-cache"
description = "DNS response cache: shared, sharded, served as patched copies of stored bytes, with serve-stale."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Counters through the `metrics` facade (D30).
metrics = ["dep:metrics"]
# `Config` read from configuration files (D24).
serde = ["dep:serde"]

[dependencies]
dedens-proto.workspace = true
metrics = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
thiserror.workspace = true

[dev-dependencies]
dedens-testkit.workspace = true
metrics.workspace = true
metrics-util = { workspace = true, features = ["debugging"] }
proptest.workspace = true
stats_alloc.workspace = true

[lints]
workspace = true
