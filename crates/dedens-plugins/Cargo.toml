[package]
name = "dedens-plugins"
description = "Plugin stages of the DNS server (D54): answers from local data, sans-IO."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
autotests = false

[features]
# `Action` read from configuration files (D24).
serde = ["dep:serde"]
# The answers of the `tlds` stage through the `metrics` facade (D30, D128).
metrics = ["dep:metrics"]

[dependencies]
dedens-proto.workspace = true
# The TLD list the `tlds` stage answers from (D128).
dedens-roots.workspace = true
dedens-server.workspace = true
metrics = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
thiserror.workspace = true

[dev-dependencies]
dedens-testkit.workspace = true
metrics.workspace = true
metrics-util = { workspace = true, features = ["debugging"] }

[[test]]
name = "tests"
path = "tests/tests.rs"

[lints]
workspace = true
