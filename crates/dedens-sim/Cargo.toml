[package]
name = "dedens-sim"
description = "Simulation tests: the sans-IO client and server cores driven over turmoil's simulated network, from a seed."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
autotests = false

[features]
# D99: scenarios of `dedensd` answering `DNSCrypt`.
dnscrypt = ["dedensd/dnscrypt"]

[dependencies]
compio.workspace = true
dedens-cache.workspace = true
dedens-net.workspace = true
dedens-proto.workspace = true
dedens-server.workspace = true
dedens-testkit.workspace = true
dedensd.workspace = true
futures-util.workspace = true
getrandom.workspace = true
metrics.workspace = true
metrics-util = { workspace = true, features = ["debugging"] }
rcgen.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = [
  "io-util",
  "macros",
  "rt",
  "sync",
  "time",
] }
turmoil.workspace = true

[dev-dependencies]
dedens-dnscrypt.workspace = true
dedens-dnssec.workspace = true
divan.workspace = true

[[test]]
name = "tests"
path = "tests/tests.rs"

[[bench]]
name = "driver"
harness = false

[lints]
workspace = true
