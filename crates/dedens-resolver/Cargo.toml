[package]
name = "dedens-resolver"
description = "The recursive resolver, sans-IO: its caches and resolution."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
autotests = false

[features]
# Counters through the `metrics` facade (D30).
metrics = ["dep:metrics"]

[dependencies]
# D193: the sharded byte-budgeted store and the TTL rules of the response cache.
dedens-cache.workspace = true
dedens-proto.workspace = true
# D191: the root's and the TLDs' servers, where a resolution starts when the cache knows no delegation.
dedens-roots.workspace = true
metrics = { workspace = true, optional = true }
# D194: the infra cache draws the server to ask with the caller's CSPRNG (RFC 5452 §4.4).
rand_core.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
# D188: the captured resolutions the scrubber's and the iteration's tests replay.
dedens-testkit = { workspace = true, features = ["recursion"] }
insta.workspace = true
metrics.workspace = true
metrics-util = { workspace = true, features = ["debugging"] }
stats_alloc.workspace = true

[[test]]
name = "tests"
path = "tests/tests.rs"

# A test that sets its own `#[global_allocator]` keeps its binary (D162).
[[test]]
name = "memory"
path = "tests/memory.rs"

[lints]
workspace = true
