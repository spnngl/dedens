[package]
name = "dedens-server"
description = "DNS server core: the query pipeline of stages, sans-IO, with the replies it builds itself."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
autotests = false

[features]
# Validation, access, rate limit, cookie and authoritative answer counters through the `metrics` facade (D30, D77,
# D91, D113, D208), and the recursive resolver's (D191, D195).
metrics = ["dep:metrics", "dedens-resolver/metrics"]
# `Network`, `Denial`, `Secret` read from configuration files (D24, D91, D113).
serde = ["dep:serde"]

[dependencies]
dedens-cache.workspace = true
dedens-dnssec.workspace = true
dedens-proto.workspace = true
dedens-resolver.workspace = true
dedens-tsig.workspace = true
dedens-zone.workspace = true
ipnet.workspace = true
metrics = { workspace = true, optional = true }
prefix-trie.workspace = true
rand_core.workspace = true
serde = { workspace = true, optional = true }
siphasher.workspace = true
subtle.workspace = true
thiserror.workspace = true
zeroize.workspace = true

[dev-dependencies]
dedens-roots.workspace = true
dedens-testkit = { workspace = true, features = ["authoritative", "recursion"] }
metrics.workspace = true
metrics-util = { workspace = true, features = ["debugging"] }

[[test]]
name = "tests"
path = "tests/tests.rs"

[lints]
workspace = true
