[package]
name = "dedens-server"
description = "DNS server core: the query pipeline of stages, sans-IO, with the replies it builds itself."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Validation and access counters through the `metrics` facade (D30, D77, D91).
metrics = ["dep:metrics"]
# `Network` and `Denial` read from configuration files (D24, D91).
serde = ["dep:serde"]

[dependencies]
dedens-cache.workspace = true
dedens-dnssec.workspace = true
dedens-proto.workspace = true
ipnet.workspace = true
metrics = { workspace = true, optional = true }
prefix-trie.workspace = true
serde = { workspace = true, optional = true }
thiserror.workspace = true

[dev-dependencies]
metrics.workspace = true
metrics-util = { workspace = true, features = ["debugging"] }

[lints]
workspace = true
