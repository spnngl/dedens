# Real DNSSEC responses from 1.1.1.1 for the validation tests, saved as <id>.bin by `just capture-dnssec`, with the
# Unix time of the run in `captured_at`. Every query sets DO and CD: the resolver returns the records and proofs
# whatever their signatures, so a validator reads each one as it was served. Each query goes over UDP; a
# truncated response is asked again over TCP. Never edit the .bin files by hand; README.md says what each shows.
server: 1.1.1.1
options: {recurse: true, dnssec: true, cdflag: true, cookie: false, bufsize: 1232}
queries:
  # Chain of trust: the root keys, then each zone's DS (in the parent) and DNSKEY.
  - {id: root_dnskey, name: ., type: DNSKEY, expect: {rcode: NOERROR}}
  - {id: com_ds, name: com, type: DS, expect: {rcode: NOERROR}}
  - {id: com_dnskey, name: com, type: DNSKEY, expect: {rcode: NOERROR}}
  - {id: net_ds, name: net, type: DS, expect: {rcode: NOERROR}}
  - {id: net_dnskey, name: net, type: DNSKEY, expect: {rcode: NOERROR}}
  - {id: org_ds, name: org, type: DS, expect: {rcode: NOERROR}}
  - {id: org_dnskey, name: org, type: DNSKEY, expect: {rcode: NOERROR}}
  - {id: nl_ds, name: nl, type: DS, expect: {rcode: NOERROR}}
  - {id: nl_dnskey, name: nl, type: DNSKEY, expect: {rcode: NOERROR}}
  - {id: cat_ds, name: cat, type: DS, expect: {rcode: NOERROR}}
  - {id: cat_dnskey, name: cat, type: DNSKEY, expect: {rcode: NOERROR}}
  - {id: la_ds, name: la, type: DS, expect: {rcode: NOERROR}}
  - {id: la_dnskey, name: la, type: DNSKEY, expect: {rcode: NOERROR}}
  - {id: cr_ds, name: cr, type: DS, expect: {rcode: NOERROR}}
  - {id: cr_dnskey, name: cr, type: DNSKEY, expect: {rcode: NOERROR}}
  - {id: dev_ds, name: dev, type: DS, expect: {rcode: NOERROR}}
  - {id: dev_dnskey, name: dev, type: DNSKEY, expect: {rcode: NOERROR}}
  - {id: stream_ds, name: stream, type: DS, expect: {rcode: NOERROR}}
  - {id: stream_dnskey, name: stream, type: DNSKEY, expect: {rcode: NOERROR}}
  - {id: nlnetlabs_nl_ds, name: nlnetlabs.nl, type: DS, expect: {rcode: NOERROR}}
  - {id: nlnetlabs_nl_dnskey, name: nlnetlabs.nl, type: DNSKEY, expect: {rcode: NOERROR}}
  - {id: cloudflare_com_ds, name: cloudflare.com, type: DS, expect: {rcode: NOERROR}}
  - {id: cloudflare_com_dnskey, name: cloudflare.com, type: DNSKEY, expect: {rcode: NOERROR}}
  - {id: fedoraproject_org_ds, name: fedoraproject.org, type: DS, expect: {rcode: NOERROR}}
  - {id: fedoraproject_org_dnskey, name: fedoraproject.org, type: DNSKEY, expect: {rcode: NOERROR}}
  - {id: ed25519_nl_ds, name: ed25519.nl, type: DS, expect: {rcode: NOERROR}}
  - {id: ed25519_nl_dnskey, name: ed25519.nl, type: DNSKEY, expect: {rcode: NOERROR}}
  - {id: ed448_nl_ds, name: ed448.nl, type: DS, expect: {rcode: NOERROR}}
  - {id: ed448_nl_dnskey, name: ed448.nl, type: DNSKEY, expect: {rcode: NOERROR}}
  - {id: debian_org_ds, name: debian.org, type: DS, expect: {rcode: NOERROR}}
  - {id: debian_org_dnskey, name: debian.org, type: DNSKEY, expect: {rcode: NOERROR}}
  - {id: sidnlabs_nl_ds, name: sidnlabs.nl, type: DS, expect: {rcode: NOERROR}}
  - {id: sidnlabs_nl_dnskey, name: sidnlabs.nl, type: DNSKEY, expect: {rcode: NOERROR}}
  - {id: example_nl_ds, name: example.nl, type: DS, expect: {rcode: NOERROR}}
  - {id: example_nl_dnskey, name: example.nl, type: DNSKEY, expect: {rcode: NOERROR}}
  - {id: icann_org_ds, name: icann.org, type: DS, expect: {rcode: NOERROR}}
  - {id: icann_org_dnskey, name: icann.org, type: DNSKEY, expect: {rcode: NOERROR}}
  - {id: cloudflare_net_ds, name: cloudflare.net, type: DS, expect: {rcode: NOERROR}}
  - {id: cloudflare_net_dnskey, name: cloudflare.net, type: DNSKEY, expect: {rcode: NOERROR}}
  - {id: ripe_net_ds, name: ripe.net, type: DS, expect: {rcode: NOERROR}}
  - {id: ripe_net_dnskey, name: ripe.net, type: DNSKEY, expect: {rcode: NOERROR}}
  - {id: rootcanary_net_ds, name: rootcanary.net, type: DS, expect: {rcode: NOERROR}}
  - {id: rootcanary_net_dnskey, name: rootcanary.net, type: DNSKEY, expect: {rcode: NOERROR}}
  - {id: verteiltesysteme_net_ds, name: verteiltesysteme.net, type: DS, expect: {rcode: NOERROR}}
  - {id: verteiltesysteme_net_dnskey, name: verteiltesysteme.net, type: DNSKEY, expect: {rcode: NOERROR}}
  - {id: ippacket_stream_ds, name: ippacket.stream, type: DS, expect: {rcode: NOERROR}}
  - {id: ippacket_stream_dnskey, name: ippacket.stream, type: DNSKEY, expect: {rcode: NOERROR}}
  - {id: rsa2048_ippacket_stream_ds, name: rsa2048-sha256.ippacket.stream, type: DS, expect: {rcode: NOERROR}}
  - {id: rsa2048_ippacket_stream_dnskey, name: rsa2048-sha256.ippacket.stream, type: DNSKEY, expect: {rcode: NOERROR}}
  - {id: dnssec_failed_org_ds, name: dnssec-failed.org, type: DS, expect: {rcode: NOERROR}}
  - {id: dnssec_failed_org_dnskey, name: dnssec-failed.org, type: DNSKEY, expect: {rcode: NOERROR}}
  - {id: rhybar_cz_ds, name: rhybar.cz, type: DS, expect: {rcode: NOERROR}}
  - {id: rhybar_cz_dnskey, name: rhybar.cz, type: DNSKEY, expect: {rcode: NOERROR}}
  - {id: cz_ds, name: cz, type: DS, expect: {rcode: NOERROR}}
  - {id: cz_dnskey, name: cz, type: DNSKEY, expect: {rcode: NOERROR}}
  - {id: wb_sidnlabs_nl_ds, name: wb.sidnlabs.nl, type: DS, expect: {rcode: NOERROR}}
  - {id: wb_sidnlabs_nl_dnskey, name: wb.sidnlabs.nl, type: DNSKEY, expect: {rcode: NOERROR}}
  - {id: bad_dnssec_wb_sidnlabs_nl_ds, name: bad-dnssec.wb.sidnlabs.nl, type: DS, expect: {rcode: NOERROR}}
  - {id: bad_dnssec_wb_sidnlabs_nl_dnskey, name: bad-dnssec.wb.sidnlabs.nl, type: DNSKEY, expect: {rcode: NOERROR}}
  - {id: sigexpired_wb_sidnlabs_nl_ds, name: sigexpired.bad-dnssec.wb.sidnlabs.nl, type: DS, expect: {rcode: NOERROR}}
  - {id: sigexpired_wb_sidnlabs_nl_dnskey, name: sigexpired.bad-dnssec.wb.sidnlabs.nl, type: DNSKEY, expect: {rcode: NOERROR}}
  # Unsigned delegations: the parent proves there is no DS (RFC 4035 §5.2, RFC 5155 §8.6, §8.9).
  - {id: google_com_ds, name: google.com, type: DS, expect: {rcode: NOERROR}}
  - {id: google_com_a, name: google.com, type: A, expect: {rcode: NOERROR}}
  - {id: jm_ds, name: jm, type: DS, expect: {rcode: NOERROR}}
  - {id: edgekey_net_ds, name: edgekey.net, type: DS, expect: {rcode: NOERROR}}
  - {id: akamaiedge_net_ds, name: akamaiedge.net, type: DS, expect: {rcode: NOERROR}}
  # What the chain of trust asks for each owner of an answer: the DS of the owner itself, which the zone answers
  # with a name error, a NODATA (the name exists or a wildcard matched), or the CNAME it holds (RFC 4035 §5.2).
  - {id: leaf_xyzzy_ds, name: xyzzy-nonexistent-tld, type: DS, expect: {rcode: NXDOMAIN}}
  - {id: leaf_nxdomain_nlnetlabs_ds, name: nonexistent.nlnetlabs.nl, type: DS, expect: {rcode: NXDOMAIN}}
  - {id: leaf_nxdomain_debian_ds, name: nonexistent.debian.org, type: DS, expect: {rcode: NXDOMAIN}}
  - {id: leaf_nxdomain_com_ds, name: nonexistent-xyz123.com, type: DS, expect: {rcode: NXDOMAIN}}
  - {id: leaf_nxdomain_org_ds, name: nonexistent-xyz123.org, type: DS, expect: {rcode: NXDOMAIN}}
  - {id: leaf_nxdomain_dev_ds, name: nonexistent-xyz123.dev, type: DS, expect: {rcode: NXDOMAIN}}
  - {id: leaf_nxname_cloudflare_ds, name: nonexistent.cloudflare.com, type: DS, expect: {rcode: NOERROR}}
  - {id: leaf_ent_nlnetlabs_ds, name: _tcp.nlnetlabs.nl, type: DS, expect: {rcode: NOERROR}}
  - {id: leaf_ent_sidnlabs_ds, name: _tcp.sidnlabs.nl, type: DS, expect: {rcode: NOERROR}}
  - {id: leaf_wildcard_sidnlabs_ds, name: wildcard-test.sidnlabs.nl, type: DS, expect: {rcode: NOERROR}}
  - {id: leaf_www_icann_org_ds, name: www.icann.org, type: DS, expect: {rcode: NOERROR}}
  - {id: leaf_cdn_cloudflare_net_ds, name: cdn.cloudflare.net, type: DS, expect: {rcode: NOERROR}}
  - {id: leaf_icann_cdn_mid_ds, name: icann.org.cdn.cloudflare.net, type: DS, expect: {rcode: NOERROR}}
  - {id: leaf_icann_cdn_ds, name: www.icann.org.cdn.cloudflare.net, type: DS, expect: {rcode: NOERROR}}
  - {id: leaf_sigok_vs_ds, name: sigok.verteiltesysteme.net, type: DS, expect: {rcode: NOERROR}}
  - {id: leaf_sigok_ippacket_ds, name: sigok.rsa2048-sha256.ippacket.stream, type: DS, expect: {rcode: NOERROR}}
  - {id: leaf_sigfail_vs_ds, name: sigfail.verteiltesysteme.net, type: DS, expect: {rcode: NOERROR}}
  - {id: leaf_sigfail_ippacket_ds, name: sigfail.rsa2048-sha256.ippacket.stream, type: DS, expect: {rcode: NOERROR}}
  - {id: leaf_www_ripe_net_ds, name: www.ripe.net, type: DS, expect: {rcode: NOERROR}}
  - {id: leaf_dname_sidnlabs_ds, name: dname.sidnlabs.nl, type: DS, expect: {rcode: NOERROR}}
  - {id: leaf_www_example_nl_ds, name: www.example.nl, type: DS, expect: {rcode: NOERROR}}
  # Signed answers, one per signing algorithm of RFC 8624 §3.1 (8, 10, 13, 14, 15), the SHA-1 one a zone still
  # uses (7), two algorithms at once (8 and 13), and Ed448 (16, which `ring` lacks).
  - {id: alg8_a, name: nlnetlabs.nl, type: A, expect: {rcode: NOERROR}}
  - {id: alg13_a, name: cloudflare.com, type: A, expect: {rcode: NOERROR}}
  - {id: alg10_soa, name: cat, type: SOA, expect: {rcode: NOERROR}}
  - {id: alg14_a, name: fedoraproject.org, type: A, expect: {rcode: NOERROR}}
  - {id: alg15_a, name: ed25519.nl, type: A, expect: {rcode: NOERROR}}
  - {id: alg7_soa, name: la, type: SOA, expect: {rcode: NOERROR}}
  - {id: alg8_13_a, name: debian.org, type: A, expect: {rcode: NOERROR}}
  - {id: alg16_a, name: ed448.nl, type: A, expect: {rcode: NOERROR}}
  - {id: rootcanary_soa, name: rootcanary.net, type: SOA, expect: {rcode: NOERROR}}
  # Denial of existence: NXDOMAIN with NSEC (RFC 4035 §5.4) and NSEC3 (RFC 5155 §8.4), opt-out, salt and extra
  # iterations included.
  - {id: nxdomain_root_nsec, name: xyzzy-nonexistent-tld, type: A, expect: {rcode: NXDOMAIN}}
  - {id: nxdomain_nsec, name: nonexistent.nlnetlabs.nl, type: A, expect: {rcode: NXDOMAIN}}
  - {id: nxdomain_nsec3, name: nonexistent.debian.org, type: A, expect: {rcode: NXDOMAIN}}
  - {id: nxdomain_nsec3_optout, name: nonexistent-xyz123.com, type: A, expect: {rcode: NXDOMAIN}}
  - {id: nxdomain_nsec3_salt, name: nonexistent-xyz123.org, type: A, expect: {rcode: NXDOMAIN}}
  - {id: nxdomain_nsec3_iterations, name: nonexistent-xyz123.dev, type: A, expect: {rcode: NXDOMAIN}}
  # Compact denial of existence (RFC 9824 §3.1, §3.2): Cloudflare answers NOERROR with an NSEC of the name that has
  # the NXNAME type, and a NODATA for an existing name with its types.
  - {id: nxname_cloudflare, name: nonexistent.cloudflare.com, type: A, expect: {rcode: NOERROR}}
  - {id: nodata_compact, name: cloudflare.com, type: SRV, expect: {rcode: NOERROR}}
  # NODATA (RFC 4035 §5.4, RFC 5155 §8.5).
  - {id: nodata_root_nsec, name: ., type: MX, expect: {rcode: NOERROR}}
  - {id: nodata_nsec, name: nlnetlabs.nl, type: CAA, expect: {rcode: NOERROR}}
  - {id: nodata_nsec3, name: debian.org, type: SRV, expect: {rcode: NOERROR}}
  - {id: nodata_nsec3_optout, name: com, type: MX, expect: {rcode: NOERROR}}
  - {id: nodata_nsec3_iterations, name: rootcanary.net, type: A, expect: {rcode: NOERROR}}
  # Empty non-terminals: the name exists, so NOERROR with a NODATA proof (RFC 4035 §5.4, RFC 5155 §8.5).
  - {id: ent_nsec, name: _tcp.nlnetlabs.nl, type: TXT, expect: {rcode: NOERROR}}
  - {id: ent_nsec3, name: _tcp.sidnlabs.nl, type: TXT, expect: {rcode: NOERROR}}
  # Wildcards (RFC 4035 §5.3.4, RFC 5155 §8.8, §8.7): the answer's RRSIG has fewer labels than its owner, and
  # NSEC3 proves the next closer name does not exist; for another type, the wildcard's own NODATA proof.
  - {id: wildcard_answer, name: wildcard-test.sidnlabs.nl, type: MX, expect: {rcode: NOERROR}}
  - {id: wildcard_nodata, name: wildcard-test.sidnlabs.nl, type: A, expect: {rcode: NOERROR}}
  # Answers that cross zones: secure to secure (org, net), secure to insecure (ripe.net to akamaiedge.net),
  # and a zone-to-zone CNAME three zones deep (net, stream, ippacket.stream, rsa2048-sha256.ippacket.stream).
  - {id: cname_cross_zone, name: www.icann.org, type: A, expect: {rcode: NOERROR}}
  - {id: cname_to_insecure, name: www.ripe.net, type: A, expect: {rcode: NOERROR}}
  - {id: cname_deep_zone, name: sigok.verteiltesysteme.net, type: A, expect: {rcode: NOERROR}}
  # DNAME (RFC 6672): the signed DNAME, its synthesized CNAME (unsigned), the signed answer in the target zone.
  # 1.1.1.1 answers the second one NXDOMAIN half the time (a bad cache entry), so 8.8.8.8 does.
  - {id: dname_rr, name: dname.sidnlabs.nl, type: DNAME, expect: {rcode: NOERROR}}
  - {id: dname_answer, name: www.dname.sidnlabs.nl, type: AAAA, server: 8.8.8.8, expect: {rcode: NOERROR}}
  # Bogus: a DS no key matches, expired signatures, a signature that does not verify.
  - {id: bogus_no_key, name: dnssec-failed.org, type: A, expect: {rcode: NOERROR}}
  - {id: bogus_expired, name: rhybar.cz, type: A, expect: {rcode: NOERROR}}
  - {id: bogus_signature, name: sigfail.verteiltesysteme.net, type: A, expect: {rcode: NOERROR}}
  # An expired signature under a sound chain (nl, sidnlabs.nl, wb.sidnlabs.nl, bad-dnssec.wb.sidnlabs.nl and the zone
  # itself, whose key the last DS names): the A of the zone ended in December 2019.
  - {id: bogus_sigexpired, name: sigexpired.bad-dnssec.wb.sidnlabs.nl, type: A, expect: {rcode: NOERROR}}
  # Referrals, as an authoritative server answers without recursion (RFC 4035 §3.1.4.1): to a signed zone, with its
  # DS, and to an unsigned one, with the proof that it has none.
  - {id: referral_signed, name: www.nlnetlabs.nl, type: A, server: 194.0.28.53, options: {recurse: false}, expect: {rcode: NOERROR}}
  - {id: referral_unsigned, name: www.google.com, type: A, server: 192.5.6.30, options: {recurse: false}, expect: {rcode: NOERROR}}
