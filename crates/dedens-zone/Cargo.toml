[package]
name = "dedens-zone"
description = "Authoritative zones: the zone model, loaded from zone text and checked (RFC 1035 §5.2, RFC 2181)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
autotests = false

[dependencies]
# The NSEC3 hash and hashed owner names of the proofs (D209): one implementation with the validator's.
dedens-dnssec.workspace = true
dedens-proto.workspace = true
thiserror.workspace = true

[dev-dependencies]
dedens-testkit = { workspace = true, features = ["authoritative"] }
insta.workspace = true
proptest.workspace = true
tempfile.workspace = true

[[test]]
name = "tests"
path = "tests/tests.rs"

[lints]
workspace = true
