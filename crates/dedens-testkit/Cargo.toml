[package]
name = "dedens-testkit"
description = "Test data and helpers shared by the tests, benches, fuzz targets and simulations of the workspace."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
autotests = false

[dependencies]
compio = { workspace = true, optional = true }
# The base64 of the RFC examples (`dnssec::b64`).
data-encoding.workspace = true
dedens-net = { workspace = true, optional = true }
dedens-odoh = { workspace = true, optional = true }
dedens-proto.workspace = true
http = { workspace = true, optional = true }
rcgen = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde-saphyr = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }

[features]
# The certificates of the TLS, QUIC and HTTPS tests (`certificates`).
certificates = ["dep:compio", "dep:dedens-net", "dep:rcgen"]
# The loopback server of the command-line tests (`responder`), and its experimental transports (D69).
responder = ["certificates", "dep:http", "dep:tempfile"]
odoh = ["responder", "dedens-net/odoh", "dep:dedens-odoh"]
doc = ["responder", "dedens-net/doc"]
# The captured resolutions of the recursive resolver and the servers replaying them (`recursion`, D188).
recursion = ["dep:serde", "dep:serde-saphyr"]
# The captures of the authoritative phase (D203): zones, reference answers and recorded exchanges, on serde too.
authoritative = ["dep:serde", "dep:serde-saphyr"]

[dev-dependencies]
# The tools capturing the resolutions and dating their signatures (`examples/capture_recursion.rs`, run by `just
# capture-recursion`; `examples/signature_expiry.rs`, `just captures-expiry`).
compio.workspace = true
dedens-net.workspace = true
dedens-roots.workspace = true

[[example]]
name = "capture_recursion"
required-features = ["recursion"]

# The tool capturing the authoritative data (`examples/capture_authoritative/`, run by `just capture-authoritative`).
[[example]]
name = "capture_authoritative"
required-features = ["authoritative"]

[[example]]
name = "signature_expiry"
required-features = ["recursion"]

[[test]]
name = "tests"
path = "tests/tests.rs"
required-features = ["recursion", "authoritative"]

[lints]
workspace = true
