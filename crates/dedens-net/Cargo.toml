[package]
name = "dedens-net"
description = "DNS transports (UDP, TCP, TLS, QUIC, HTTPS over HTTP/3) on the compio runtime, and the sans-IO core of DoH."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
compio.workspace = true
dedens-proto.workspace = true
flume.workspace = true
futures-util.workspace = true
getrandom.workspace = true
http.workspace = true
rustls-platform-verifier.workspace = true
thiserror.workspace = true
tracing = { workspace = true, optional = true }

[features]
# D69: experimental transports, off by default: Oblivious DoH (RFC 9230) and DNS over CoAP (DoC).
odoh = []
doc = []
# D30: debug events on dropped messages, retries and fallbacks, trace events per message; none without it.
tracing = ["dep:tracing"]

[dev-dependencies]
compio = { workspace = true, features = ["macros"] }
proptest.workspace = true
rcgen.workspace = true

[[bench]]
name = "transports"
harness = false

[lints]
workspace = true
