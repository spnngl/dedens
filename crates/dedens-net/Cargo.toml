[package]
name = "dedens-net"
description = "DNS transports (UDP, TCP, TLS, QUIC, HTTPS over HTTP/3, CoAP) on the compio runtime, and the sans-IO cores of DoH and DoC."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
autotests = false

[dependencies]
compio.workspace = true
dedens-odoh = { workspace = true, optional = true }
dedens-proto.workspace = true
flume.workspace = true
futures-util.workspace = true
getrandom.workspace = true
http.workspace = true
idna = { workspace = true, optional = true }
rustls-platform-verifier.workspace = true
thiserror.workspace = true
tracing = { workspace = true, optional = true }
zeroize = { workspace = true, optional = true }

[features]
# D69: experimental transports, off by default: Oblivious DoH (RFC 9230) and DNS over CoAP (DoC).
odoh = ["dep:dedens-odoh", "dep:idna", "dep:zeroize"]
doc = []
# D30: debug events on dropped messages, retries and fallbacks, trace events per message; none without it.
tracing = ["dep:tracing"]

[dev-dependencies]
compio = { workspace = true, features = ["macros"] }
dedens-odoh.workspace = true
dedens-testkit = { workspace = true, features = ["certificates"] }
proptest.workspace = true

[[test]]
name = "tests"
path = "tests/tests.rs"

[[bench]]
name = "pools"
harness = false

[[bench]]
name = "transports"
harness = false

[lints]
workspace = true
