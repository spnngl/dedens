[package]
name = "dedens-net"
description = "DNS transports (UDP, TCP, TLS) on the compio runtime."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
compio.workspace = true
dedens-proto.workspace = true
flume.workspace = true
futures-util.workspace = true
getrandom.workspace = true
rustls-platform-verifier.workspace = true
thiserror.workspace = true
tracing = { workspace = true, optional = true }

[features]
# D30: debug events on dropped messages, retries and fallbacks, trace events per message; none without it.
tracing = ["dep:tracing"]

[dev-dependencies]
compio = { workspace = true, features = ["macros"] }
proptest.workspace = true
rcgen.workspace = true

[lints]
workspace = true
