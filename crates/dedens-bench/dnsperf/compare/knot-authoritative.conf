# Knot DNS as a server of the `authoritative` modes (D213): the zones of compare.py as they are, signed already, its
# defaults but the addresses, a UDP and a TCP worker for each of the server's cores, no signing (the zones carry
# their signatures: kzonesign signed the generated one), no journal and no zone file written back. Its working
# directory is the container's own: a database on the bind mount of /w is not what a server runs on.
# Rendered by compare.py: `@NAME@` is a value, a `#@tag ` line is kept when the run serves that zone.
server:
    listen: 127.0.0.1@5301
    rundir: /tmp
    udp-workers: @CORES@
    tcp-workers: @CORES@
    background-workers: 1

database:
    storage: /tmp

log:
  - target: stderr
    any: warning

template:
  - id: default
    zonefile-sync: -1
    zonefile-load: whole
    journal-content: none

zone:
#@root   - domain: .
#@root     file: /w/zones/root.zone
#@big   - domain: big.example.
#@big     file: /w/zones/big.example.zone
