# Unbound for the `recurse` modes of compare.sh, shipped and lean alike: its defaults, resolving from the root hints
# of the mini Internet (recurse-root.hints), with what the bench needs as unbound.conf does.
server:
    interface: 127.0.0.1@5301
    num-threads: @CORES@
    username: ""
    chroot: ""
    directory: "/w/data"
    pidfile: ""
    use-syslog: no
    do-not-query-localhost: no
    root-hints: "/w/root.hints"
#@dnssec     trust-anchor-file: "/w/anchors.zone"
