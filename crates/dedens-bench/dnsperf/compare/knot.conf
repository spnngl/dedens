# The neutral upstream (compare.sh): Knot DNS serving root.zone on 127.0.0.1:5300, signed with NSEC3 (no
# iterations, no salt) for `dnssec`, so that a validator proves each wildcard answer and aggressive NSEC
# shortcuts nothing.
server:
    listen: 127.0.0.1@5300
    rundir: /w/knot
    udp-workers: @KNOT_THREADS@
    tcp-workers: @KNOT_THREADS@
    background-workers: 1

database:
    storage: /w/knot

log:
  - target: stderr
    any: warning

policy:
  - id: bench
    algorithm: ecdsap256sha256
    nsec3: on
    nsec3-iterations: 0
    nsec3-salt-length: 0

zone:
  - domain: .
    file: /w/root.zone
    zonefile-sync: -1
    zonefile-load: whole
    journal-content: none
#@dnssec     dnssec-signing: on
#@dnssec     dnssec-policy: bench
