# Signs the generated zone of the `authoritative` modes (D213) with `kzonesign`, once a run: NSEC3 without iterations
# or salt, as the `dnssec` mode's Knot signs. The keys are made by the first signing; the signed zone file goes
# to the directory given with -o. Rendered by compare.py.
server:
    rundir: /tmp/sign

database:
    storage: /tmp/sign

policy:
  - id: bench
    algorithm: ecdsap256sha256
    nsec3: on
    nsec3-iterations: 0
    nsec3-salt-length: 0
    signing-threads: @THREADS@

zone:
  - domain: big.example.
    file: /w/gen/big.example.zone
    dnssec-signing: on
    dnssec-policy: bench
