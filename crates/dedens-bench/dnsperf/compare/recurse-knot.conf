# One authority of the mini Internet of the `recurse` modes (compare.sh): Knot DNS serving one of its zones on its own
# address, port 53, signed as knot.conf's is for `recurse-dnssec`. One Knot process per zone, so that none knows
# another's zone and a server finds a delegation only by being referred.
server:
    listen: @ADDR@@53
    rundir: /w/knot/@NAME@
    udp-workers: @KNOT_THREADS@
    tcp-workers: @KNOT_THREADS@
    background-workers: 1

database:
    storage: /w/knot/@NAME@

log:
  - target: stderr
    any: warning

policy:
  - id: bench
    algorithm: ecdsap256sha256
    nsec3: on
    nsec3-iterations: 0
    nsec3-salt-length: 0

zone:
  - domain: @ZONE@
    file: /w/knot/@NAME@/zone
    zonefile-sync: -1
    zonefile-load: whole
    journal-content: none
#@dnssec     dnssec-signing: on
#@dnssec     dnssec-policy: bench
