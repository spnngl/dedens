# NSD as a server of the `authoritative` modes (D213): the zones of compare.py as they are, signed already, its
# defaults but the address, a server process for each of the server's cores, no chroot or user change, and its state
# in the container's own /tmp. It runs in the foreground (`nsd -d`), logging to stderr.
# Rendered by compare.py: `@NAME@` is a value, a `#@tag ` line is kept when the run serves that zone.
server:
    ip-address: 127.0.0.1@5301
    do-ip6: no
    server-count: @CORES@
    username: ""
    chroot: ""
    pidfile: "/tmp/nsd.pid"
    zonelistfile: "/tmp/nsd-zone.list"
    xfrdfile: "/tmp/nsd-xfrd.state"
    zonesdir: "/w/zones"
    hide-version: yes
    verbosity: 0

#@root zone:
#@root     name: "."
#@root     zonefile: "root.zone"
#@big zone:
#@big     name: "big.example."
#@big     zonefile: "big.example.zone"
