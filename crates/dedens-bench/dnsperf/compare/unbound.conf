# Unbound for compare.sh, shipped and lean alike: its defaults (the unbound.conf of its release sets nothing; it
# logs no query and keeps no statistics unless asked), with what the bench needs: the addresses, Knot as the
# upstream of every name, no chroot or user change, and a thread per core, which Unbound does not count itself.
# Rendered by compare.py: `@NAME@` is a value, a `#@tag ` line is kept, uncommented, when the run has that tag.
server:
    interface: 127.0.0.1@5301
    interface: 127.0.0.1@8531
    tls-port: 8531
    tls-service-key: "/w/key.pem"
    tls-service-pem: "/w/cert.pem"
    num-threads: @CORES@
    username: ""
    chroot: ""
    directory: "/w/data"
    pidfile: ""
    use-syslog: no
    do-not-query-localhost: no
    tcp-upstream: @TCP_UPSTREAM@
#@dnssec     trust-anchor-file: "/w/anchors.zone"
#@blocked     include: "/w/blocklist.conf"

forward-zone:
    name: "."
    forward-addr: 127.0.0.1@5300
