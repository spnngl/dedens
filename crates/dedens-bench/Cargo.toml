[package]
name = "dedens-bench"
description = "Benches of dedens against other DNS libraries; regular dependencies, so cargo-deny checks them."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# The cache's counters on, with no recorder: the cost of the toggle (D30).
metrics = ["dedens-cache/metrics"]
# The counters on and an in-memory recorder installed, atomic counters as an exporter's.
recorder = ["metrics", "dep:metrics-util"]
# D152 (experiment): the allocator under test, wrapped by the benches in `AllocProfiler` (`src/alloc.rs`).
alloc-mimalloc = ["dep:mimalloc"]
alloc-mimalloc-secure = ["dep:mimalloc", "mimalloc/secure"]
alloc-jemalloc = ["dep:tikv-jemallocator"]

[dependencies]
# The RFC examples' keys and signatures, in base64, for `benches/dnssec.rs`.
data-encoding.workspace = true
dedens-cache.workspace = true
dedens-dnssec.workspace = true
dedens-net.workspace = true
# The exchange of `benches/odoh.rs`.
dedens-odoh.workspace = true
dedens-plugins.workspace = true
dedens-proto.workspace = true
dedens-server.workspace = true
divan.workspace = true
http.workspace = true
# Zone file readers, for `benches/zone.rs`.
domain = { workspace = true, features = ["zonefile"] }
hickory-proto = { workspace = true, features = ["std"] }
metrics-util = { workspace = true, features = ["debugging"], optional = true }
mimalloc = { workspace = true, optional = true }
tikv-jemallocator = { workspace = true, optional = true }

[[bench]]
name = "message"
harness = false

[[bench]]
name = "cache"
harness = false

[[bench]]
name = "zone"
harness = false

[[bench]]
name = "server"
harness = false

[[bench]]
name = "blocklist"
harness = false

[[bench]]
name = "doh"
harness = false

[[bench]]
name = "dnssec"
harness = false

[[bench]]
name = "odoh"
harness = false

[[bench]]
name = "coap"
harness = false

[[bench]]
name = "access"
harness = false
[[bench]]
name = "rrl"
harness = false

# D143: the benches' dependencies stay regular ones, so cargo-deny checks them (D14); data-encoding serves
# `crates/dedens-dnssec/tests/common/mod.rs`, a module of `benches/dnssec.rs` by `#[path]`, outside this package.
[package.metadata.cargo-shear]
ignored = [
  "data-encoding",
  "dedens-cache",
  "dedens-dnssec",
  "dedens-net",
  "dedens-odoh",
  "dedens-plugins",
  "dedens-proto",
  "dedens-server",
  "divan",
  "domain",
  "hickory-proto",
  "http",
  "metrics-util",
  "mimalloc",
  "tikv-jemallocator",
]

[lints]
workspace = true
