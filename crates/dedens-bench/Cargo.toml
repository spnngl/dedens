[package]
name = "dedens-bench"
description = "Benches of dedens against other DNS libraries; regular dependencies, so cargo-deny checks them."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
autotests = false

[features]
# The cache's counters on, with no recorder: the cost of the toggle (D30).
metrics = ["dedens-cache/metrics"]
# The counters on and an in-memory recorder installed, atomic counters as an exporter's.
recorder = ["metrics", "dep:metrics-util"]

[dependencies]
dedens-cache.workspace = true
# The exchange of `benches/dnscrypt.rs`.
dedens-dnscrypt.workspace = true
# `fetch-anchors`: the signed root anchors of `benches/anchors.rs`.
dedens-dnssec = { workspace = true, features = ["fetch-anchors"] }
dedens-net.workspace = true
# The exchange of `benches/odoh.rs`.
dedens-odoh.workspace = true
dedens-plugins.workspace = true
dedens-proto.workspace = true
# The `RRset` cache of `benches/rrset_cache.rs`, the scrubber of `benches/scrub.rs`, the resolution of
# `benches/resolution.rs`.
dedens-resolver.workspace = true
dedens-roots.workspace = true
dedens-server.workspace = true
divan.workspace = true
http.workspace = true
# Zone file readers, for `benches/zone.rs`.
domain = { workspace = true, features = ["zonefile"] }
hickory-proto = { workspace = true, features = ["std"] }
metrics-util = { workspace = true, features = ["debugging"], optional = true }
# The randomness of `benches/odoh.rs`, `benches/dnscrypt.rs` and `benches/resolution.rs`.
rand_core.workspace = true

[dev-dependencies]
# The shared test data (D161); `recursion`, the captured resolutions of `benches/scrub.rs`.
dedens-testkit = { workspace = true, features = ["recursion"] }
# The loading of the zone of `benches/zone.rs`.
dedens-zone.workspace = true

[[bench]]
name = "message"
harness = false

[[bench]]
name = "cache"
harness = false

[[bench]]
name = "zone"
harness = false

[[bench]]
name = "server"
harness = false

[[bench]]
name = "blocklist"
harness = false

[[bench]]
name = "doh"
harness = false

[[bench]]
name = "dnssec"
harness = false

[[bench]]
name = "odoh"
harness = false

[[bench]]
name = "dnscrypt"
harness = false

[[bench]]
name = "coap"
harness = false

[[bench]]
name = "access"
harness = false
[[bench]]
name = "rrl"
harness = false

[[bench]]
name = "roots"
harness = false

[[bench]]
name = "anchors"
harness = false

[[bench]]
name = "rrset_cache"
harness = false

[[bench]]
name = "scrub"
harness = false

[[bench]]
name = "resolution"
harness = false

# D143: the benches' dependencies stay regular ones, so cargo-deny checks them (D14).
[package.metadata.cargo-shear]
ignored = [
  "dedens-cache",
  "dedens-dnscrypt",
  "dedens-dnssec",
  "dedens-net",
  "dedens-odoh",
  "dedens-plugins",
  "dedens-proto",
  "dedens-resolver",
  "dedens-roots",
  "dedens-server",
  "divan",
  "domain",
  "hickory-proto",
  "http",
  "metrics-util",
  "rand_core",
]

[[test]]
name = "tests"
path = "tests/tests.rs"

[lints]
workspace = true
