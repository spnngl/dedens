# Public DNS resolvers (D67). `apps/dedens/tests/providers.rs` reads this file: `cargo test` checks its fields,
# `just providers` asks every endpoint over the network, and each resolver every canary below.
#
# A provider: `id` (unique), `name`, `operator`, `country` (ISO 3166-1 alpha-2, where the operator is
# established), `site`, `description`, `privacy` (logging and jurisdiction), then its `resolvers`.
# A resolver: `id` (unique in its provider), an optional `description`, `blocks` (any of `ads` (and trackers),
# `malware` (and phishing), `adult`, `gambling`, `social`; as measured with the `canaries` below), `block_pages`
# (addresses answered for a blocked name, beside `0.0.0.0`, `127.0.0.1` and NXDOMAIN), `dnssec` (as
# measured: `validates`, `ignores`, or `inconsistent` when its servers disagree), `stale_cookies: true` when a
# packet cache answers with the cookie of an earlier client (RFC 7873 §5.3 drops such a response; the test asks
# without a cookie), then its endpoints, at least one:
#   plain: addresses answering DNS over UDP and TCP, port 53;
#   tls: {name, addresses}: DNS over TLS (RFC 7858), port 853, `name` the one its certificate holds;
#   quic: {name, addresses}: DNS over QUIC (RFC 9250), UDP port 853;
#   https: DNS over HTTPS (RFC 8484) URLs, listed only until `dedens` speaks DoH (D62).
# IPv6 addresses are quoted: a plain YAML scalar cannot end with `:`. Anchors (`&x`, `*x`) share a list.

# Per category, a name every resolver blocking it blocks and the others answer (measured November 2026). No
# provider publishes a test name all its peers block: Cloudflare's `malware.testcategory.com` and Quad9's
# `isitblocked.org` work at their own resolvers only. `malware.wicar.org` is the WICAR malware test site.
canaries:
  ads: pagead2.googlesyndication.com
  malware: malware.wicar.org
  adult: pornhub.com
  gambling: bet365.com
  social: facebook.com

providers:
  - id: cloudflare
    name: Cloudflare
    operator: Cloudflare, Inc.
    country: US
    site: https://one.one.one.one
    description: >-
      Anycast resolver in hundreds of cities, among the fastest worldwide; QNAME minimization. 1.1.1.1 for Families adds malware and adult content blocking.
    privacy: >-
      No client IP written to disk; the logs kept are deleted within 25 hours and audited yearly. US company (Five Eyes); no custom blocking.
    resolvers:
      - id: standard
        blocks: []
        dnssec: validates
        plain: &cloudflare
          - 1.1.1.1
          - 1.0.0.1
          - "2606:4700:4700::1111"
          - "2606:4700:4700::1001"
        tls: {name: cloudflare-dns.com, addresses: *cloudflare}
        https:
          - https://cloudflare-dns.com/dns-query
      - id: security
        blocks:
          - malware
        dnssec: validates
        plain: &cloudflare-security
          - 1.1.1.2
          - 1.0.0.2
          - "2606:4700:4700::1112"
          - "2606:4700:4700::1002"
        tls: {name: security.cloudflare-dns.com, addresses: *cloudflare-security}
        https:
          - https://security.cloudflare-dns.com/dns-query
      - id: family
        blocks:
          - malware
          - adult
        dnssec: validates
        plain: &cloudflare-family
          - 1.1.1.3
          - 1.0.0.3
          - "2606:4700:4700::1113"
          - "2606:4700:4700::1003"
        tls: {name: family.cloudflare-dns.com, addresses: *cloudflare-family}
        https:
          - https://family.cloudflare-dns.com/dns-query

