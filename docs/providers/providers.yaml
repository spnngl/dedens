    site: https://blog.uncensoreddns.org/dns-servers/
    description: >-
      Uncensored resolver run by one person since 2009: an anycast address (servers in Denmark and the US) and a unicast server in Denmark; QNAME minimization, no filtering. Encrypted only: plain DNS on port 53 was turned off in September 2022.
    privacy: Logs nothing but query counts; warrant canary. Single operator, single point of failure.
    # Stale cookies: a padded query with AD set gets the cached response of the first such query, its client
    # cookie included (November 2026).
    resolvers:
      - id: anycast
        blocks: []
        dnssec: validates
        stale_cookies: true
        tls: {name: anycast.uncensoreddns.org, addresses: [91.239.100.100, "2001:67c:28a4::"]}
        https:
          - https://anycast.uncensoreddns.org/dns-query
      - id: unicast
        blocks: []
        dnssec: validates
        stale_cookies: true
        tls: {name: unicast.uncensoreddns.org, addresses: [89.233.43.71, "2a01:3a0:53:53::"]}
        https:
          - https://unicast.uncensoreddns.org/dns-query
