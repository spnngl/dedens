# Published blocklists (D87, D88). `apps/dedensd/tests/blocklists.rs` reads this file: `cargo test` checks its
# fields, `just blocklists` downloads every list and checks its `format`, its `updated` and its source's `status`.
# Facts checked at each source on 2026-11-01.
#
# A source: `id` (unique), `name`, `maintainer`, `site`, `status`, `license`, `use`, `terms`, `description` (how
# it is built), then its main `lists`.
#   status: `active`; `frozen: <date>`, its lists unchanged since that day (UTC); `retired`, no list left to
#     download, `lists: []`.
#   license: an SPDX id; `custom`, its own terms; `none`, no licence given.
#   use: what the terms allow with the data, as read: `free` (any use, commercial included; an SPDX licence),
#     `no-resale` (any use but selling it), `non-commercial`, `ask` (in a product or a service for others, only
#     with permission), `unknown` (no terms given).
#   terms: the terms, quoted short; for a `custom` or `none` licence only.
# A list: `id` (unique in its source), an optional `description`, `url`, `format`, `categories` (any of `ads` (and
# trackers), `malware`, `phishing`, `scam`, `cryptojacking`, `adult`, `gambling`, `spam`, `botnet` (command and
# control), `attacks` (addresses scanning, brute-forcing, exploiting): what it holds), `updated` (an ISO 8601
# duration of weeks to seconds, `P1D` or `PT30M`, as announced, else as measured from the file's dates; or
# `irregular`). `format`, as measured, a line each after `#`, `;` or `!` comments:
#   domains: a name; `dedensd` reads it (D56) as the name and its subdomains, as OISD and HaGeZi mean theirs;
#   wildcard: `*.name`, read as `domains`;
#   hosts: `/etc/hosts`, `0.0.0.0 name`, read by `dedensd`;
#   adblock: `||name^` rules, not read by `dedensd` (D56);
#   ips: an IPv4 or IPv6 address or CIDR network first, other columns after it; nothing `dedensd` reads;
#   urls: a URL; its host is not the blocked thing (shared hosting), nothing `dedensd` reads.

sources:
  - id: oisd
    name: oisd
    maintainer: Stephan van Ruth (sjhgvr)
    site: https://oisd.nl
    status: active
    license: GPL-3.0-only
    use: free
    description: >-
      Aggregates public blocklists and keeps only entries that break no site ("Block. Don't break."); dead domains pruned every 5 days. Each name blocks its subdomains; exact-name and hosts files ended on 2024-01-01.
    lists:
      - id: big
        description: >-
          Ads, mobile ads, phishing, malvertising, malware, spyware, ransomware, cryptojacking and tracking not needed for sites to work. Holds all of `small`.
        url: https://big.oisd.nl/domainswild2
        format: domains
        categories:
          - ads
          - malware
          - phishing
          - cryptojacking
        updated: P1D
      - id: small
        description: Mainly ads; a subset of `big`.
        url: https://small.oisd.nl/domainswild2
        format: domains
        categories:
          - ads
        updated: P1D
      - id: nsfw
        description: Porn, shock and adult sites; lists the whole TLDs `adult`, `porn`, `sex` and `xxx`.
        url: https://nsfw.oisd.nl/domainswild2
        format: domains
        categories:
          - adult
        updated: P1D

