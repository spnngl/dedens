[files]
# Fetched as published: `just rfc-archive`, `just root-hints`.
# Records of captured responses, as published.
extend-exclude = [
  "docs/rfc/archive/",
  "apps/dedens/src/named.root",
  "apps/dedensd/tests/end_to_end.yaml",
  # Blocklists and hosts files, as published.
  "crates/dedens-plugins/tests/testdata/",
]
[default]
# RFC 4648 §10 base64 test vector
extend-ignore-re = ['\("fo", "Zm8="\)']

[default.extend-words]
# Extended DNS Error (RFC 8914)
ede = "ede"
Ede = "Ede"
EDE = "EDE"
# GOST, the Russian standard of DNSSEC algorithm 12 and DS digest 3 (RFC 5933)
gost = "gost"
Gost = "Gost"
GOST = "GOST"
