[files]
# Fetched as published: `just rfc-archive`, `just roots`.
# Records of captured responses, as published.
extend-exclude = [
  "docs/rfc/archive/",
  "crates/dedens-roots/src/named.root",
  "crates/dedens-roots/src/tlds.json",
  "crates/dedens-roots/tests/data/tlds.json",
  "apps/dedensd/tests/end_to_end.yaml",
  # RFC 5155 appendix A, as published.
  "testdata/zones/rfc5155_appendix_a.zone",
  # RFC 4035 appendix A, as published.
  "testdata/zones/rfc4035_appendix_a.zone",
  # Blocklists and hosts files, as published.
  "testdata/plugins/",
  # Zones as transferred, and base64 of captured messages (`just capture-authoritative`).
  "testdata/authoritative/zones/",
  "testdata/authoritative/answers/",
  "testdata/authoritative/recordings/",
  # Hex of captured CoAP datagrams.
  "testdata/coap/",
  # Base64 of captured responses (`just capture-recursion`, `just capture-minimisation`).
  "testdata/recursion/*.yaml",
  "testdata/recursion/minimised/*.yaml",
  # RDAP answers and IANA's bootstrap file, as published (`just rdap-capture`).
  "testdata/rdap/",
  # The resolver and relay lists of `DNSCrypt/dnscrypt-resolvers`, as published (D102).
  "crates/dedens-net/tests/testdata/stamps/",
]
[default]
# DNS stamps (`sdns://` and base64url), RFC 4648 §10 base64 and base32hex test vectors, and what sits between `// spellchecker:off` and `// spellchecker:on`:
# the base64 keys and signatures of the RFC examples (`crates/dedens-dnssec/tests/util/mod.rs`).
extend-ignore-re = [
  'sdns://[A-Za-z0-9_-]+',
  '\("fo", "(Zm8=|cpng)"\)',
  '(?s)//\s*spellchecker:off.*?//\s*spellchecker:on',
  # SHA-256 certificate fingerprints, colon-separated hex (D127).
  '\b[0-9A-F]{2}(:[0-9A-F]{2}){31}\b',
]

[default.extend-identifiers]
# A GitHub user whose allowlist Phishing Army filters with (`docs/blocklists/blocklists.yaml`)
anudeepND = "anudeepND"

[default.extend-words]
# Extended DNS Error (RFC 8914)
ede = "ede"
Ede = "Ede"
EDE = "EDE"
# GOST, the Russian standard of DNSSEC algorithm 12 and DS digest 3 (RFC 5933)
gost = "gost"
Gost = "Gost"
GOST = "GOST"
# `CapInh`, the inheritable capabilities of `/proc/PID/status` (D122)
Inh = "Inh"
# Nominet, the registry of `uk` (D130)
Nominet = "Nominet"
# Retransmission timeout (RFC 6298), `rto` in code (D194)
rto = "rto"
RTO = "RTO"
