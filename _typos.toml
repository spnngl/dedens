[files]
# Fetched as published: `just rfc-archive`, `just root-hints`.
# Records of captured responses, as published.
extend-exclude = [
  "docs/rfc/archive/",
  "apps/dedens/src/named.root",
  "apps/dedensd/tests/end_to_end.yaml",
  # RFC 5155 appendix A, as published.
  "crates/dedens-proto/tests/zones/rfc5155_appendix_a.zone",
  # Blocklists and hosts files, as published.
  "crates/dedens-plugins/tests/testdata/",
]
[default]
# RFC 4648 §10 base64 and base32hex test vectors, and what sits between `// spellchecker:off` and `// spellchecker:on`:
# the base64 keys and signatures of the RFC examples (`crates/dedens-dnssec/tests/common/mod.rs`).
extend-ignore-re = [
  '\("fo", "(Zm8=|cpng)"\)',
  '(?s)//\s*spellchecker:off.*?//\s*spellchecker:on',
]

[default.extend-words]
# Extended DNS Error (RFC 8914)
ede = "ede"
Ede = "Ede"
EDE = "EDE"
# GOST, the Russian standard of DNSSEC algorithm 12 and DS digest 3 (RFC 5933)
gost = "gost"
Gost = "Gost"
GOST = "GOST"
