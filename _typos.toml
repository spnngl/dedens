[files]
# Fetched as published: `just rfc-archive`, `just root-hints`.
# Records of captured responses, as published.
extend-exclude = [
  "docs/rfc/archive/",
  "apps/dedens/src/named.root",
  "apps/dedensd/tests/end_to_end.yaml",
  # RFC 5155 appendix A, as published.
  "testdata/zones/rfc5155_appendix_a.zone",
  # RFC 4035 appendix A, as published.
  "testdata/zones/rfc4035_appendix_a.zone",
  # Blocklists and hosts files, as published.
  "testdata/plugins/",
  # Hex of captured CoAP datagrams.
  "testdata/coap/",
  # The resolver and relay lists of `DNSCrypt/dnscrypt-resolvers`, as published (D102).
  "crates/dedens-net/tests/testdata/stamps/",
]
[default]
# DNS stamps (`sdns://` and base64url), RFC 4648 §10 base64 and base32hex test vectors, and what sits between `// spellchecker:off` and `// spellchecker:on`:
# the base64 keys and signatures of the RFC examples (`crates/dedens-dnssec/tests/util/mod.rs`).
extend-ignore-re = [
  'sdns://[A-Za-z0-9_-]+',
  '\("fo", "(Zm8=|cpng)"\)',
  '(?s)//\s*spellchecker:off.*?//\s*spellchecker:on',
]

[default.extend-identifiers]
# A GitHub user whose allowlist Phishing Army filters with (`docs/blocklists/blocklists.yaml`)
anudeepND = "anudeepND"

[default.extend-words]
# Extended DNS Error (RFC 8914)
ede = "ede"
Ede = "Ede"
EDE = "EDE"
# GOST, the Russian standard of DNSSEC algorithm 12 and DS digest 3 (RFC 5933)
gost = "gost"
Gost = "Gost"
GOST = "GOST"
# `CapInh`, the inheritable capabilities of `/proc/PID/status` (D122)
Inh = "Inh"
