# cargo-deny (D14): `just deny`, on the workspace and on fuzz/.

[graph]
all-features = true

[advisories]
# Unmaintained crates fail the check, transitive ones included.
unmaintained = "all"
yanked = "deny"
# D155: reached through loom only, which no shipped build compiles.
ignore = [
  { id = "RUSTSEC-2026-0441", reason = "pin-utils, unmaintained: loom's, under cfg(loom) and cfg(dedens_loom) only" },
]

[licenses]
# ISC: rustls's `ring`, `untrusted` and `webpki`; CDLA-Permissive-2.0: the CA certificates of `webpki-roots` (D57).
allow = [
  "Apache-2.0",
  "BSD-3-Clause",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]
# LLVM's libFuzzer, vendored by the fuzz harness only, never shipped.
exceptions = [{ crate = "libfuzzer-sys", allow = ["NCSA"] }]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace path dependencies carry no version.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# D147: compio's fix for UDP on Linux's `poll` fallback, until a release has it.
allow-git = ["https://github.com/spnngl/compio"]
